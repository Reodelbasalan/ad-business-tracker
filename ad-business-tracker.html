    '<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); margin-bottom:20px;" id="acctCards"></div>'+
    '<div class="tabs" style="margin-bottom:14px;"><button class="tab-btn '+(ui.tab==='accounts'?'active':'')+'" data-tab="accounts">Accounts</button><button class="tab-btn '+(ui.tab==='ledger'?'active':'')+'" data-tab="ledger">Transfers & Capital</button></div>'+
    '<div id="cashTabBody"></div>';
  container.innerHTML=''; container.appendChild(wrap);
  document.getElementById('acctCards').innerHTML = accounts.map(acc=>{
    const flow = Calc_cashAccountFlow(acc.id, resolveRange('This Month'));
    const bal = Calc_cashAccountBalance(acc.id);
    return '<div class="card"><div class="card-head"><h3>'+escapeHtml(acc.name)+'</h3><span class="sub">'+acc.type+(acc.currency!=='PHP'?' · held in '+acc.currency:'')+'</span></div>'+
      '<div class="num" style="font-size:22px; font-weight:800;">'+fmtMoney(bal)+'</div>'+
      '<div class="divider"></div><div style="display:flex; justify-content:space-between; font-size:11.8px;"><span style="color:var(--success);">'+icon('arrowUp','icon-sm')+' In: '+fmtMoney(flow.inAmt)+'</span><span style="color:var(--danger);">'+icon('arrowDown','icon-sm')+' Out: '+fmtMoney(flow.outAmt)+'</span></div>'+
      '<div class="cell-muted" style="font-size:11px; margin-top:8px;">Last activity: '+fmtDateShort(Calc_cashAccountMoveDates(acc.id))+'</div>'+
      '<div style="margin-top:12px; display:flex; gap:6px;"><button class="btn btn-sm" data-editacct="'+acc.id+'">Edit</button><button class="btn btn-sm btn-danger" data-delacct="'+acc.id+'">Delete</button></div></div>';
  }).join('') || '<div class="card"><div class="empty-state">'+icon('cash','icon-lg')+'<h4>No accounts yet.</h4><p>Add GCash, Bank, PayPal or another account to start tracking cash.</p></div></div>';

  document.getElementById('cashAddAcctBtn').onclick = ()=> openEntityForm({title:'Cash Account', fields:accountFields(), defaults:()=>({type:'GCash', currency:'PHP', fxRateToPHP:1, openingBalance:0}), onSave:v=>Entities.create('cashAccounts', v)});
  document.getElementById('cashAddTxnBtn').onclick = ()=> openEntityForm({title:'Transfer / Capital Movement', fields:accountTxnFields(), defaults:()=>({date:todayStr(), type:'Transfer'}), onSave:v=>Entities.create('accountTransactions', v)});
  wrap.querySelectorAll('[data-editacct]').forEach(b=> b.onclick=()=> openEntityForm({title:'Cash Account', fields:accountFields(), onSave:v=>Entities.update('cashAccounts', b.getAttribute('data-editacct'), v), onDelete:()=>Entities.softDelete('cashAccounts', b.getAttribute('data-editacct'))}, Entities.get('cashAccounts', b.getAttribute('data-editacct'))));
  wrap.querySelectorAll('[data-delacct]').forEach(b=> b.onclick=async ()=>{ const ok=await confirmDialog({title:'Delete account?', message:'Historical transactions referencing this account will remain, but it will no longer appear in pickers.', danger:true, okText:'Delete'}); if(ok){ Entities.softDelete('cashAccounts', b.getAttribute('data-delacct')); render(); toast('Account deleted.'); } });
  wrap.querySelectorAll('.tab-btn').forEach(b=> b.onclick=()=>{ ui.tab=b.getAttribute('data-tab'); renderCashPage(container); });

  const body = wrap.querySelector('#cashTabBody');
  if(ui.tab==='accounts'){
    body.innerHTML = '<p class="sub">Transfers between accounts, owner draws and capital movements never affect revenue or profit — track them in the Transfers & Capital tab.</p>';
  } else {
    renderCrudPage(body, {
      stateKey:'accountTxns', collection:'accountTransactions', title:'Transfers & Capital', subtitle:'Non-P&L cash movements: transfers, owner draws, loans and capital.',
      itemName:'Movement', icon:'cash', exportName:'account_transactions',
      emptyTitle:'No transfers logged yet.', emptyDesc:'Log a transfer, draw or capital movement.', emptyCta:'Add Movement',
      formFields:accountTxnFields(), formDefaults:()=>({date:todayStr(), type:'Transfer'}),
      searchText:r=>r.type+' '+(r.notes||''),
      filters:[{key:'type', label:'Type', options:['Transfer','Capital In',"Owner's Draw",'Loan In','Loan Out','Opening Adjustment'], match:(r,v)=>r.type===v}],
      defaultSort:(a,b)=>b.date.localeCompare(a.date),
      columns:[
        {label:'Date', render:r=>fmtDateShort(r.date)},
        {label:'Type', render:r=>'<span class="badge badge-neutral">'+r.type+'</span>'},
        {label:'From', render:r=>escapeHtml((accountOf(r.fromAccount)||{}).name||'—')},
        {label:'To', render:r=>escapeHtml((accountOf(r.toAccount)||{}).name||'—')},
        {label:'Amount', render:r=>'<span class="cell-num cell-strong">'+fmtMoney(r.amount)+'</span>'},
        {label:'Notes', render:r=>escapeHtml(r.notes||'')},
      ],
      rowActions:['edit','delete'],
      onCreate:v=>Entities.create('accountTransactions', v),
      onUpdate:(id,v)=>Entities.update('accountTransactions', id, v),
      onDelete:id=>Entities.softDelete('accountTransactions', id),
    });
  }
}

/* =========================================================================
   22. TARGETS + BREAK-EVEN
   ========================================================================= */
function targetFields(){
  return [
    {key:'month', label:'Month', type:'text', required:true, readonly:true, hint:'YYYY-MM — set automatically for the month you\'re viewing.'},
    {key:'revenueGoal', label:'Monthly Revenue Goal', type:'currency', required:true},
    {key:'profitGoal', label:'Monthly Net Profit Goal', type:'currency'},
    {key:'maxExpenseBudget', label:'Maximum Expense Budget', type:'currency'},
    {key:'maxAdBudget', label:'Maximum Ad Budget', type:'currency'},
    {key:'salesTarget', label:'Sales Target (# of sales)', type:'number'},
    {key:'targetRoas', label:'Target ROAS', type:'number'},
  ];
}
function renderTargetsPage(container){
  let ui = CRUD_UI['targetsMonth'] = CRUD_UI['targetsMonth']||{month:monthKey(todayStr())};
  const tgt = Entities.list('targets').find(t=>t.month===ui.month);
  const mRange = resolveRange('Custom Range', {start:ui.month+'-01', end: ui.month===monthKey(todayStr())?todayStr(): toDateStr(new Date(+ui.month.slice(0,4), +ui.month.slice(5,7),0)) });
  const mp = Calc_period(mRange);
  const be = Calc_breakeven(mRange);

  let html = '<div class="page-head"><div><h2>Business Targets</h2><p class="sub">Monthly goals, tracked independently so editing one month never changes another.</p></div>'+
    '<div class="toolbar"><button class="btn btn-icon" id="tgtPrev">'+icon('chevronLeft','icon-sm')+'</button><span style="font-weight:800; font-size:13px; align-self:center;">'+fmtMonthLabel(ui.month)+'</span><button class="btn btn-icon" id="tgtNext">'+icon('chevronRight','icon-sm')+'</button>'+
    '<button class="btn btn-primary" id="tgtEditBtn">'+icon('edit')+' '+(tgt?'Edit':'Set')+' Targets</button></div></div>';

  if(!tgt){
    html += '<div class="card"><div class="empty-state">'+icon('targets','icon-lg')+'<h4>No targets set for '+fmtMonthLabel(ui.month)+'.</h4><p>Set a revenue goal, expense budget and ROAS target for this month.</p></div></div>';
  } else {
    const pct = clamp(safeDiv(mp.netRevenue,tgt.revenueGoal),0,1.5);
    const daysInMonth = new Date(+ui.month.slice(0,4), +ui.month.slice(5,7), 0).getDate();
    const isCurrentMonth = ui.month===monthKey(todayStr());
    const dayOfMonth = isCurrentMonth ? new Date().getDate() : daysInMonth;
    const daysRemaining = isCurrentMonth ? Math.max(0,daysInMonth-dayOfMonth) : 0;
    const remaining = Math.max(0, tgt.revenueGoal-mp.netRevenue);
    const requiredDaily = daysRemaining>0?remaining/daysRemaining:0;
    const projected = dayOfMonth>0 ? (mp.netRevenue/dayOfMonth)*daysInMonth : 0;

    html += '<div class="card pad-lg" style="margin-bottom:16px;">'+
      '<div class="card-head"><h3>MONTHLY REVENUE GOAL</h3><span class="sub">'+fmtMoney(tgt.revenueGoal)+'</span></div>'+
      '<div class="progress-track" style="height:14px; margin-bottom:10px;"><div class="progress-fill '+(pct<0.5?'danger':pct<0.85?'warning':'')+'" style="width:'+(pct*100)+'%"></div></div>'+
      '<div style="font-size:13px; font-weight:700; margin-bottom:16px;">'+fmtPct(pct)+' achieved · Current: '+fmtMoney(mp.netRevenue)+'</div>'+
      '<div class="grid grid-3">'+
      '<div class="mini-stat"><span class="lbl">Remaining</span><span class="val num">'+fmtMoney(remaining)+'</span></div>'+
      '<div class="mini-stat"><span class="lbl">Days Remaining</span><span class="val num">'+daysRemaining+'</span></div>'+
      '<div class="mini-stat"><span class="lbl">Required Daily Revenue</span><span class="val num">'+fmtMoney(requiredDaily)+'</span></div>'+
      '<div class="mini-stat"><span class="lbl">Projected Month-End</span><span class="val num">'+fmtMoney(projected)+'</span></div>'+
      '<div class="mini-stat"><span class="lbl">Net Profit Goal</span><span class="val num">'+fmtMoney(tgt.profitGoal)+' <span class="cell-muted" style="font-size:11px;">('+fmtPct(safeDiv(mp.netProfit,tgt.profitGoal||1))+')</span></span></div>'+
      '<div class="mini-stat"><span class="lbl">Sales Target</span><span class="val num">'+mp.sales.length+' / '+tgt.salesTarget+'</span></div>'+
      '</div></div>';

    html += '<div class="grid grid-3" style="margin-bottom:16px;">'+
      '<div class="card"><div class="card-head"><h3>Expense Budget</h3></div>'+budgetBar(mp.totalExpenses, tgt.maxExpenseBudget)+'</div>'+
      '<div class="card"><div class="card-head"><h3>Ad Budget</h3></div>'+budgetBar(mp.adSpend, tgt.maxAdBudget)+'</div>'+
      '<div class="card"><div class="card-head"><h3>ROAS vs Target</h3></div><div class="num" style="font-size:24px; font-weight:800; color:'+(mp.roasBlended>=tgt.targetRoas?'var(--success)':'var(--warning)')+'">'+(mp.roasBlended||0).toFixed(2)+'x</div><div class="cell-muted" style="font-size:12px; margin-top:4px;">Target: '+tgt.targetRoas+'x</div></div>'+
      '</div>';
  }

  html += '<div class="card pad-lg"><div class="card-head"><h3>Break-Even Analysis</h3><span class="sub">'+fmtMonthLabel(ui.month)+'</span></div>'+
    '<div class="grid grid-3" style="margin-bottom:14px;">'+
    '<div class="mini-stat"><span class="lbl">Monthly Fixed Expenses</span><span class="val num">'+fmtMoney(be.fixed)+'</span></div>'+
    '<div class="mini-stat"><span class="lbl">Avg. Contribution Margin</span><span class="val num">'+fmtPct(be.contributionMargin)+'</span></div>'+
    '<div class="mini-stat"><span class="lbl">Break-Even Revenue</span><span class="val num">'+fmtMoney(be.breakEvenRevenue)+'</span></div>'+
    '</div>'+
    '<div class="badge '+(be.passed?'badge-success':'badge-warning')+'" style="font-size:12px; padding:8px 14px;">'+
    (be.passed ? '✓ You have passed your break-even point for '+fmtMonthLabel(ui.month)+'.' : fmtMoney(Math.max(0,be.breakEvenRevenue-be.currentRevenue))+' remaining to reach break-even ('+(be.salesNeeded||0)+' more avg.-value sales).')+
    '</div></div>';

  container.innerHTML = html;
  document.getElementById('tgtPrev').onclick = ()=>{ const d=new Date(+ui.month.slice(0,4), +ui.month.slice(5,7)-2, 1); ui.month=d.getFullYear()+'-'+pad2(d.getMonth()+1); render(); };
  document.getElementById('tgtNext').onclick = ()=>{ const d=new Date(+ui.month.slice(0,4), +ui.month.slice(5,7), 1); ui.month=d.getFullYear()+'-'+pad2(d.getMonth()+1); render(); };
  document.getElementById('tgtEditBtn').onclick = ()=> openEntityForm({
    title:'Monthly Targets', fields:targetFields(), defaults:()=>({month:ui.month, revenueGoal:0, profitGoal:0, maxExpenseBudget:0, maxAdBudget:0, salesTarget:0, targetRoas:4}),
    onSave:v=>{ if(tgt) Entities.update('targets', tgt.id, v); else Entities.create('targets', Object.assign({},v,{month:ui.month})); }
  }, tgt);
}
function budgetBar(used, max){
  const pct = clamp(safeDiv(used,max),0,1.4);
  return '<div class="num" style="font-size:20px; font-weight:800; margin-bottom:8px;">'+fmtMoney(used)+' <span class="cell-muted" style="font-size:12px; font-weight:600;">/ '+fmtMoney(max)+'</span></div>'+
    '<div class="progress-track"><div class="progress-fill '+(pct>=1?'danger':pct>=0.85?'warning':'')+'" style="width:'+(pct*100)+'%"></div></div>'+
    '<div class="cell-muted" style="font-size:11.5px; margin-top:6px;">'+fmtPct(pct)+' of budget used</div>';
}

/* =========================================================================
   23. REPORTS PAGE
   ========================================================================= */
function renderReportsPage(container){
  let ui = CRUD_UI['reportsUi'] = CRUD_UI['reportsUi']||{preset:'This Month'};
  const range = resolveRange(ui.preset);
  const p = Calc_period(range);

  let html = '<div class="page-head"><div><h2>Reports</h2><p class="sub">Interactive charts across every part of the business.</p></div>'+
    '<div class="toolbar"><select class="select" id="repRangeSel" style="width:auto;">'+RANGE_PRESETS.filter(r=>r!=='Custom Range').map(r=>'<option '+(ui.preset===r?'selected':'')+'>'+r+'</option>').join('')+'</select></div></div>';

  html += businessPerformanceHtml(p, range) + monthlyScorecardHtml();

  html += '<div class="grid" style="grid-template-columns:1fr 1fr; margin-bottom:14px;">'+
    '<div class="card"><div class="card-head"><h3>Monthly Revenue</h3></div><div id="repMonthlyRev"></div></div>'+
    '<div class="card"><div class="card-head"><h3>Monthly Net Profit</h3></div><div id="repMonthlyProfit"></div></div>'+
    '</div>';
  html += '<div class="card" style="margin-bottom:14px;"><div class="card-head"><h3>Revenue by Offer</h3><div class="pill-tabs" id="repOfferTypeTabs"><span class="pill active" data-type="all">All</span><span class="pill" data-type="Service">Services</span><span class="pill" data-type="Digital Product">Digital Products</span></div></div><div id="repRevByOffer"></div></div>';
  html += '<div class="grid" style="grid-template-columns:1fr 1fr; margin-bottom:14px;">'+
    '<div class="card"><div class="card-head"><h3>Expense Breakdown</h3></div><div id="repExpBreakdown"></div></div>'+
    '<div class="card"><div class="card-head"><h3>Revenue by Category</h3></div><div id="repRevByCategory"></div></div>'+
    '</div>';
  html += '<div class="grid" style="grid-template-columns:1fr 1fr; margin-bottom:14px;">'+
    '<div class="card"><div class="card-head"><h3>Advertising Spend vs Revenue</h3></div><div id="repAdVsRev"></div></div>'+
    '<div class="card"><div class="card-head"><h3>ROAS Trend</h3></div><div id="repRoasTrend"></div></div>'+
    '</div>';
  html += '<div class="grid" style="grid-template-columns:1fr 1fr; margin-bottom:14px;">'+
    '<div class="card"><div class="card-head"><h3>Sales by Offer</h3></div><div id="repSalesByOffer"></div></div>'+
    '<div class="card"><div class="card-head"><h3>Top Clients by Revenue</h3></div><div id="repTopClients"></div></div>'+
    '</div>';
  html += '<div class="grid" style="grid-template-columns:1fr 1fr;">'+
    '<div class="card"><div class="card-head"><h3>Receivables Aging</h3></div><div id="repReceivablesAging"></div></div>'+
    '<div class="card"><div class="card-head"><h3>Payroll Costs</h3></div><div id="repPayroll"></div></div>'+
    '</div>';

  container.innerHTML = html;
  document.getElementById('repRangeSel').onchange = e=>{ ui.preset=e.target.value; render(); };

  const months = monthsBack(6);
  const revS=[], profS=[], adS=[], adRevS=[], roasS=[];
  months.forEach(mk=>{
    const r = resolveRange('Custom Range', {start:mk+'-01', end: mk===monthKey(todayStr())?todayStr():toDateStr(new Date(+mk.slice(0,4), +mk.slice(5,7),0))});
    const pm = Calc_period(r);
    revS.push(round0(pm.netRevenue)); profS.push(round0(pm.netProfit)); adS.push(round0(pm.adSpend)); adRevS.push(round0(pm.revenueFromAds)); roasS.push(+((pm.roasBlended)||0).toFixed(2));
  });
  mountBarChart(document.getElementById('repMonthlyRev'), months.map((m,i)=>({label:fmtMonthLabel(m).split(' ')[0], value:revS[i]})), {yFormat:fmtMoney});
  mountBarChart(document.getElementById('repMonthlyProfit'), months.map((m,i)=>({label:fmtMonthLabel(m).split(' ')[0], value:profS[i], color: profS[i]>=0?'#199e70':'#e66767'})), {yFormat:fmtMoney});
  mountLineChart(document.getElementById('repAdVsRev'), [{name:'Ad Spend', data:adS, color:'#e66767'},{name:'Revenue from Ads', data:adRevS, color:'#3987e5', area:true}], {labels:months.map(m=>fmtMonthLabel(m).split(' ')[0]), yFormat:fmtMoney});
  mountLineChart(document.getElementById('repRoasTrend'), [{name:'Blended ROAS', data:roasS, color:'#FFD400', area:true}], {labels:months.map(m=>fmtMonthLabel(m).split(' ')[0]), yFormat:v=>v.toFixed(1)+'x'});

  function drawOfferRev(type){
    const rev={};
    p.sales.filter(s=>type==='all'||s.type===type).forEach(s=>{ const o=offerOf(s.offerId); const k=o?o.name:'Unknown'; rev[k]=(rev[k]||0)+Calc_saleNet(s); });
    mountBarChart(document.getElementById('repRevByOffer'), Object.keys(rev).map(k=>({label:k,value:rev[k]})).sort((a,b)=>b.value-a.value).slice(0,8), {horizontal:true, yFormat:fmtMoney});
  }
  drawOfferRev('all');
  document.querySelectorAll('#repOfferTypeTabs .pill').forEach(pill=> pill.onclick=()=>{ document.querySelectorAll('#repOfferTypeTabs .pill').forEach(x=>x.classList.remove('active')); pill.classList.add('active'); drawOfferRev(pill.getAttribute('data-type')); });

  const expByCat={}; p.lines.forEach(l=>{ expByCat[l.categoryName]=(expByCat[l.categoryName]||0)+l.amount; });
  mountBarChart(document.getElementById('repExpBreakdown'), Object.keys(expByCat).map(k=>({label:k,value:expByCat[k]})).sort((a,b)=>b.value-a.value).slice(0,8), {horizontal:true, yFormat:fmtMoney});

  const revByCat={}; p.sales.forEach(s=>{ revByCat[s.category||'Uncategorized']=(revByCat[s.category||'Uncategorized']||0)+Calc_saleNet(s); });
  mountBarChart(document.getElementById('repRevByCategory'), Object.keys(revByCat).map(k=>({label:k,value:revByCat[k]})).sort((a,b)=>b.value-a.value).slice(0,8), {horizontal:true, yFormat:fmtMoney});

  const salesByOffer={}; p.sales.forEach(s=>{ const o=offerOf(s.offerId); const k=o?o.name:'Unknown'; salesByOffer[k]=(salesByOffer[k]||0)+safeNum(s.qty); });
  mountBarChart(document.getElementById('repSalesByOffer'), Object.keys(salesByOffer).map(k=>({label:k,value:salesByOffer[k]})).sort((a,b)=>b.value-a.value).slice(0,8), {horizontal:true, yFormat:v=>fmtNum(v,0)});

  const clientRev={}; p.sales.forEach(s=>{ const c=clientOf(s.clientId); const k=c?c.name:'Unknown'; clientRev[k]=(clientRev[k]||0)+Calc_saleNet(s); });
  mountBarChart(document.getElementById('repTopClients'), Object.keys(clientRev).map(k=>({label:k,value:clientRev[k]})).sort((a,b)=>b.value-a.value).slice(0,8), {horizontal:true, yFormat:fmtMoney});

  const rec = Calc_outstandingReceivables();
  const buckets = {Current:0, 'Due Soon':0, Overdue:0};
  rec.forEach(s=>{ const st=Calc_saleStatus(s); if(st==='Overdue') buckets.Overdue+=Calc_saleBalance(s); else if(s.dueDate && s.dueDate<=addDays(todayStr(),7)) buckets['Due Soon']+=Calc_saleBalance(s); else buckets.Current+=Calc_saleBalance(s); });
  mountBarChart(document.getElementById('repReceivablesAging'), [{label:'Current', value:buckets.Current, color:'#199e70'},{label:'Due Soon', value:buckets['Due Soon'], color:'#c98500'},{label:'Overdue', value:buckets.Overdue, color:'#e66767'}], {horizontal:true, yFormat:fmtMoney});

  const payrollByMember={}; Entities.list('payroll').filter(pr=>inRange(pr.date,range.start,range.end)).forEach(pr=>{ const m=memberOf(pr.teamMemberId); const k=m?m.name:'Unknown'; payrollByMember[k]=(payrollByMember[k]||0)+safeNum(pr.amount); });
  mountBarChart(document.getElementById('repPayroll'), Object.keys(payrollByMember).map(k=>({label:k,value:payrollByMember[k]})).sort((a,b)=>b.value-a.value).slice(0,8), {horizontal:true, yFormat:fmtMoney});
}

/* =========================================================================
   24. BUSINESS PERFORMANCE + SCORECARD
   ========================================================================= */
function perfCard(label, name, metricLabel, metricVal){
  return '<div class="card"><div class="k-label">'+escapeHtml(label)+'</div>'+
    '<div style="font-size:15.5px; font-weight:800; margin-top:10px;">'+escapeHtml(name||'—')+'</div>'+
    '<div class="cell-muted" style="font-size:11.5px; margin-top:4px;">'+metricLabel+': <b style="color:var(--text);">'+metricVal+'</b></div></div>';
}
function businessPerformanceHtml(p, range){
  const byOfferNet={}, byOfferProfit={}, byOfferQty={};
  p.sales.forEach(s=>{ const o=offerOf(s.offerId); const k=o?o.name:'Unknown'; byOfferNet[k]=(byOfferNet[k]||0)+Calc_saleNet(s); byOfferProfit[k]=(byOfferProfit[k]||0)+Calc_saleProfit(s); byOfferQty[k]=(byOfferQty[k]||0)+safeNum(s.qty); });
  const topService = Object.entries(byOfferNet).filter(([k])=>{ const o=Entities.list('offers').find(x=>x.name===k); return o&&o.type==='Service'; }).sort((a,b)=>b[1]-a[1])[0];
  const topProduct = Object.entries(byOfferNet).filter(([k])=>{ const o=Entities.list('offers').find(x=>x.name===k); return o&&o.type==='Digital Product'; }).sort((a,b)=>b[1]-a[1])[0];
  const mostProfitable = Object.entries(byOfferProfit).sort((a,b)=>b[1]-a[1])[0];
  const mostSales = Object.entries(byOfferQty).sort((a,b)=>b[1]-a[1])[0];
  const clientRev={}; p.sales.forEach(s=>{ const c=clientOf(s.clientId); const k=c?c.name:'Unknown'; clientRev[k]=(clientRev[k]||0)+Calc_saleNet(s); });
  const topClient = Object.entries(clientRev).sort((a,b)=>b[1]-a[1])[0];
  const expByCat={}; p.lines.forEach(l=>{ expByCat[l.categoryName]=(expByCat[l.categoryName]||0)+l.amount; });
  const biggestExpense = Object.entries(expByCat).sort((a,b)=>b[1]-a[1])[0];
  const campaignRoas={}; p.campaigns.forEach(c=>{ const o=offerOf(c.offerId); const k=o?o.name:c.campaignName; const roas=safeDiv(c.revenueGenerated,c.adSpend); if(!campaignRoas[k]||roas>campaignRoas[k]) campaignRoas[k]=roas; });
  const bestRoas = Object.entries(campaignRoas).sort((a,b)=>b[1]-a[1])[0];

  return '<div class="card-head" style="margin:22px 0 10px;"><h3 style="font-size:15px;">Business Performance</h3><span class="sub">'+rangeDisplay(range)+' — ranked by the metric shown, not revenue alone</span></div>'+
    '<div class="grid" style="grid-template-columns:repeat(4,minmax(0,1fr)); margin-bottom:20px;">'+
    perfCard('Top Service', topService&&topService[0], 'Net Revenue', fmtMoney(topService?topService[1]:0))+
    perfCard('Top Digital Product', topProduct&&topProduct[0], 'Net Revenue', fmtMoney(topProduct?topProduct[1]:0))+

/* =========================================================================
   25. ALERTS ENGINE
   ========================================================================= */
function computeAlerts(){
  const alerts = [];
  const th = Settings().thresholds;
  const thisMonth = resolveRange('This Month');
  const p = Calc_period(thisMonth);
  const tgt = Entities.list('targets').find(t=>t.month===monthKey(todayStr()));
  const dismissed = new Set(STATE.dismissedAlerts||[]);

  if(tgt){
    const pctAchieved = safeDiv(p.netRevenue, tgt.revenueGoal);
    const dayOfMonth = new Date().getDate();
    const daysInMonth = new Date(new Date().getFullYear(), new Date().getMonth()+1, 0).getDate();
    const expectedPct = dayOfMonth/daysInMonth;
    if(pctAchieved < expectedPct - 0.1){
      alerts.push({key:'rev-behind-'+monthKey(todayStr()), severity:'WARNING', title:'Revenue behind target', desc:'You\'re at '+fmtPct(pctAchieved)+' of this month\'s goal with '+fmtPct(1-dayOfMonth/daysInMonth)+' of the month left.', goto:'targets'});
    }
    if(p.totalExpenses > tgt.maxExpenseBudget && tgt.maxExpenseBudget>0){
      alerts.push({key:'exp-over-'+monthKey(todayStr()), severity:'URGENT', title:'Expense budget exceeded', desc:'Expenses ('+fmtMoney(p.totalExpenses)+') have passed your budget of '+fmtMoney(tgt.maxExpenseBudget)+'.', goto:'expenses'});
    }
    if(tgt.maxAdBudget>0 && p.adSpend >= tgt.maxAdBudget*0.9){
      alerts.push({key:'ad-budget-'+monthKey(todayStr()), severity: p.adSpend>=tgt.maxAdBudget?'URGENT':'WARNING', title:'Advertising budget almost reached', desc:'Ad spend is at '+fmtMoney(p.adSpend)+' of your '+fmtMoney(tgt.maxAdBudget)+' budget.', goto:'advertising'});
    }
    if(p.roasBlended>0 && p.roasBlended < tgt.targetRoas*0.7){
      alerts.push({key:'roas-low-blended', severity:'WARNING', title:'Blended ROAS below target', desc:'This month\'s blended ROAS is '+p.roasBlended.toFixed(2)+'x, below your '+tgt.targetRoas+'x target.', goto:'advertising'});
    }
  }
  Entities.list('campaigns').filter(c=>inRange(c.date, thisMonth.start, thisMonth.end)).forEach(c=>{
    const cpm = safeDiv(c.adSpend, c.messages);
    const roas = safeDiv(c.revenueGenerated, c.adSpend);
    if(c.messages>0 && cpm > th.highCPM) alerts.push({key:'cpm-'+c.id, severity:'WARNING', title:'High cost per message', desc:'"'+c.campaignName+'" is at '+fmtMoney(cpm)+' per message (threshold '+fmtMoney(th.highCPM)+').', goto:'advertising'});
    if(c.adSpend>0 && c.purchases===0 && c.messages>15) alerts.push({key:'nopurchase-'+c.id, severity:'URGENT', title:'No purchases from ad spend', desc:'"'+c.campaignName+'" spent '+fmtMoney(c.adSpend)+' with zero purchases so far.', goto:'advertising'});
    else if(c.adSpend>0 && roas>0 && roas < th.lowROAS) alerts.push({key:'roas-'+c.id, severity:'WARNING', title:'Low ROAS campaign', desc:'"'+c.campaignName+'" is returning '+roas.toFixed(2)+'x (below '+th.lowROAS+'x).', goto:'advertising'});
    else if(c.adSpend>0 && roas>=th.goodROAS) alerts.push({key:'good-'+c.id, severity:'GOOD', title:'Good ad performance', desc:'"'+c.campaignName+'" is returning '+roas.toFixed(2)+'x ROAS.', goto:'advertising'});
    if(c.adSpend > th.highAdSpendDaily) alerts.push({key:'highspend-'+c.id, severity:'INFO', title:'High ad spend entry', desc:'"'+c.campaignName+'" logged '+fmtMoney(c.adSpend)+' in a single entry.', goto:'advertising'});
  });
  Calc_outstandingReceivables().forEach(s=>{
    if(Calc_saleStatus(s)==='Overdue'){
      const c = clientOf(s.clientId);
      alerts.push({key:'overdue-'+s.id, severity:'URGENT', title:'Overdue client payment', desc:(c?c.name:'A client')+' has an overdue balance of '+fmtMoney(Calc_saleBalance(s))+'.', goto:'receivables'});
    }
  });
  Entities.list('teamMembers').forEach(m=>{
    if(m.nextPayment && m.nextPayment>=todayStr() && m.nextPayment<=addDays(todayStr(),3)){
      alerts.push({key:'payroll-'+m.id, severity:'INFO', title:'Upcoming payroll', desc:m.name+' is due for payment on '+fmtDate(m.nextPayment)+'.', goto:'team'});
    }
  });
  Entities.list('expenses').filter(e=>e.recurring).forEach(e=>{
    const nextDue = e.frequency==='Monthly' ? addDays(e.date,30) : e.frequency==='Weekly' ? addDays(e.date,7) : e.frequency==='Yearly' ? addDays(e.date,365) : addDays(e.date,90);
    if(nextDue>=todayStr() && nextDue<=addDays(todayStr(),5)){
      alerts.push({key:'subdue-'+e.id, severity:'INFO', title:'Subscription payment due', desc:e.name+' ('+fmtMoney(e.amount)+') is due around '+fmtDate(nextDue)+'.', goto:'expenses'});
    }
  });
  if(p.netProfit<0) alerts.push({key:'negative-profit-'+monthKey(todayStr()), severity:'URGENT', title:'Negative profit this month', desc:'This month is currently running at a net loss of '+fmtMoney(Math.abs(p.netProfit))+'.', goto:'reports'});
  Entities.list('offers').forEach(o=>{
    const price = o.promoPrice||o.regularPrice;
    const margin = safeDiv(price-safeNum(o.fulfillmentCost)-safeNum(o.adAllocation), price);
    if(price>0 && margin<0.15) alerts.push({key:'lowmargin-'+o.id, severity:'INFO', title:'Low-margin offer', desc:'"'+o.name+'" has an estimated margin of only '+fmtPct(margin)+'.', goto:'services'});
  });
  const avgExpense = safeDiv(p.lines.reduce((a,l)=>a+l.amount,0), p.lines.length||1);
  p.lines.forEach(l=>{ if(avgExpense>0 && l.amount > avgExpense*4 && l.amount>3000) alerts.push({key:'unusual-'+l.id, severity:'INFO', title:'Unusually high expense', desc:'"'+l.name+'" ('+fmtMoney(l.amount)+') is well above your average expense this period.', goto:'expenses'}); });

  return alerts.filter(a=>!dismissed.has(a.key)).sort((a,b)=>{ const order={URGENT:0,WARNING:1,INFO:2,GOOD:3}; return order[a.severity]-order[b.severity]; });
}
function alertRowHtml(a){
  return '<div class="alert-row" data-key="'+a.key+'"><div class="alert-icon '+a.severity+'">'+icon(a.severity==='GOOD'?'check':a.severity==='URGENT'?'x':a.severity==='WARNING'?'alerts':'info','icon-sm')+'</div>'+
    '<div style="flex:1;"><div class="alert-title">'+escapeHtml(a.title)+'</div><div class="alert-desc">'+escapeHtml(a.desc)+'</div></div>'+
    '<span class="badge badge-'+(a.severity==='URGENT'?'danger':a.severity==='WARNING'?'warning':a.severity==='GOOD'?'success':'info')+'" style="align-self:flex-start;">'+a.severity+'</span>'+
    '<button class="btn btn-icon btn-ghost alert-dismiss" data-dismiss="'+a.key+'" title="Dismiss">'+icon('close','icon-sm')+'</button></div>';
}
function renderAlertsPage(container){
  const alerts = computeAlerts();
  let html = '<div class="page-head"><div><h2>Alert Center</h2><p class="sub">Everything that needs your attention, ranked by severity.</p></div>'+
    (alerts.length?'<button class="btn" id="dismissAllBtn">Dismiss All</button>':'')+'</div>';
  if(!alerts.length){
    html += '<div class="card"><div class="empty-state">'+icon('check','icon-lg')+'<h4>All clear.</h4><p>No alerts right now — revenue, budgets and ROAS all look on track.</p></div></div>';
  } else {
    html += '<div>'+alerts.map(alertRowHtml).join('')+'</div>';
  }
  container.innerHTML = html;
  container.querySelectorAll('.alert-row').forEach(el=>{
    el.addEventListener('click', e=>{ if(e.target.closest('[data-dismiss]')) return; const a=alerts.find(x=>x.key===el.getAttribute('data-key')); if(a&&a.goto) goTo(a.goto); });
  });
  container.querySelectorAll('[data-dismiss]').forEach(btn=> btn.onclick = e=>{ e.stopPropagation(); const key=btn.getAttribute('data-dismiss'); STATE.dismissedAlerts = (STATE.dismissedAlerts||[]).concat(key); DB_save(); render(); });
  const dismissAllBtn = document.getElementById('dismissAllBtn');
  if(dismissAllBtn) dismissAllBtn.onclick = ()=>{ STATE.dismissedAlerts = (STATE.dismissedAlerts||[]).concat(alerts.map(a=>a.key)); DB_save(); render(); };
}

/* CSV import ----------------------------------------------------------------*/
let IMPORT_TYPE = 'sales';
function parseCsv(text){
  const lines = text.split(/\r?\n/).filter(l=>l.length);
  const rows = lines.map(l=>{ const out=[]; let cur='', q=false; for(let i=0;i<l.length;i++){ const c=l[i]; if(q){ if(c==='"'){ if(l[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=c; } else { if(c==='"') q=true; else if(c===','){ out.push(cur); cur=''; } else cur+=c; } } out.push(cur); return out; });
  const headers = rows.shift()||[];
  return rows.map(r=>{ const o={}; headers.forEach((h,i)=>o[h.trim()]=r[i]); return o; });
}
function handleImportFile(e){
  const file = e.target.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    let parsed;
    try{ parsed = parseCsv(reader.result); }catch(err){ toast('Could not read that CSV file.','error'); return; }
    openImportPreview(IMPORT_TYPE, parsed);
  };
  reader.readAsText(file);
  e.target.value='';
}
function openImportPreview(type, rows){
  const preview = rows.slice(0,8);
  const cols = preview.length?Object.keys(preview[0]):[];
  const html = '<div class="modal-panel wide"><div class="modal-head"><h3>Import Preview — '+type+'</h3><button class="btn btn-icon btn-ghost" id="ipClose">'+icon('close')+'</button></div>'+
    '<div class="modal-body"><p class="sub" style="margin-bottom:12px;">'+rows.length+' row(s) found. Showing the first '+preview.length+'. Confirm to import as new records.</p>'+
    '<div class="table-wrap"><table class="tbl"><thead><tr>'+cols.map(c=>'<th>'+escapeHtml(c)+'</th>').join('')+'</tr></thead><tbody>'+
    preview.map(r=>'<tr>'+cols.map(c=>'<td>'+escapeHtml(r[c]||'')+'</td></tr>').join('')+'</tr>').join('')+
    '</tbody></table></div></div><div class="modal-foot"><button class="btn" id="ipCancel">Cancel</button><button class="btn btn-primary" id="ipConfirm">'+icon('check')+' Import '+rows.length+' Rows</button></div></div>';
  openModalRaw(html);
  document.getElementById('ipClose').onclick = closeModal;
  document.getElementById('ipCancel').onclick = closeModal;
  document.getElementById('ipConfirm').onclick = ()=>{
    let count=0;
    rows.forEach(r=>{
      try{
        if(type==='sales') Entities.create('sales', {date:r.Date||r.date||todayStr(), clientId:findByName('clients',r.Client||r.client)||'', offerId:findByName('offers',r.Offer||r.offer)||'', type:r.Type||r.type||'Service', qty:+(r.Qty||r.qty||1), price:+(r.Price||r.price||0), discount:+(r.Discount||0), directCost:+(r.DirectCost||0), paymentFee:+(r.PaymentFee||0), amountPaid:+(r.AmountPaid||r.Price||0), refund:0, account:(Entities.list('cashAccounts')[0]||{}).id||'', paymentMethod:r.PaymentMethod||'Cash', paymentStatus:r.PaymentStatus||'Paid'});
        else if(type==='expenses') Entities.create('expenses', {date:r.Date||r.date||todayStr(), name:r.Name||r.name||'Imported expense', categoryId:findByName('expenseCategories',r.Category)||(Entities.list('expenseCategories')[0]||{}).id, vendor:r.Vendor||'', amount:+(r.Amount||r.amount||0), account:(Entities.list('cashAccounts')[0]||{}).id||'', tag:'Business'});
        else if(type==='clients') Entities.create('clients', {name:r.Name||r.name||'Imported Client', company:r.Company||'', phone:r.Phone||'', email:r.Email||'', projectStatus:r.Status||'New Lead', startDate:todayStr()});
        else if(type==='campaigns') Entities.create('campaigns', {date:r.Date||r.date||todayStr(), platform:r.Platform||'Meta Ads', campaignName:r.Campaign||r.campaignName||'Imported Campaign', adSpend:+(r.AdSpend||r.Spend||0), messages:+(r.Messages||0), purchases:+(r.Purchases||0), revenueGenerated:+(r.Revenue||0), account:(Entities.list('cashAccounts')[0]||{}).id||''});
        count++;
      }catch(err){ /* skip malformed row */ }
    });
    closeModal(); render(); toast('Imported '+count+' of '+rows.length+' rows.');
  };
}
function findByName(col,name){ if(!name) return null; const r=Entities.list(col).find(x=>(x.name||'').toLowerCase()===String(name).toLowerCase()); return r?r.id:null; }
function handleRestoreFile(e){
  const file = e.target.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = async ()=>{
    let data;
    try{ data = JSON.parse(reader.result); }catch(err){ toast('That file isn\'t a valid backup.','error'); return; }
    if(!data || !data.settings){ toast('That file isn\'t a valid Ad Business Tracker backup.','error'); return; }
    const ok = await confirmDialog({title:'Restore backup?', message:'This will replace all current data in this browser with the contents of the backup file. This cannot be undone.', danger:true, okText:'Restore'});
    if(ok){ STATE = data; DB_save(); render(); toast('Backup restored.'); }
  };
  reader.readAsText(file);
  e.target.value='';
}

function buildSearchIndex(){
  const idx = [];
  Entities.list('clients').forEach(c=> idx.push({group:'Clients', label:c.name, meta:c.company||c.email||'', icon:'clients', goto:'clients'}));
  Entities.list('sales').forEach(s=> idx.push({group:'Transactions', label:(clientOf(s.clientId)||{}).name+' — '+(offerOf(s.offerId)||{}).name, meta:fmtDateShort(s.date)+' · '+fmtMoney(Calc_saleNet(s)), icon:'sales', goto:'sales'}));
  Entities.list('offers').forEach(o=> idx.push({group:'Products', label:o.name, meta:o.category, icon:'services', goto:'services'}));
  Entities.list('expenses').forEach(e=> idx.push({group:'Expenses', label:e.name, meta:fmtDateShort(e.date)+' · '+fmtMoney(e.amount), icon:'expenses', goto:'expenses'}));
  Entities.list('campaigns').forEach(c=> idx.push({group:'Campaigns', label:c.campaignName, meta:c.platform, icon:'advertising', goto:'advertising'}));
  Entities.list('teamMembers').forEach(m=> idx.push({group:'Team Members', label:m.name, meta:m.role, icon:'team', goto:'team'}));
  return idx;
}
function openSearch(){
  const overlay = document.getElementById('search-overlay');
  const panel = document.getElementById('searchPanel');
  panel.innerHTML = '<div class="search-panel-input">'+icon('search')+'<input type="text" id="searchInput" placeholder="Search clients, sales, products, expenses, campaigns, team…" autofocus></div><div class="search-results" id="searchResults"></div>';
  overlay.classList.add('open');
  const input = document.getElementById('searchInput');
  input.focus();
  const runSearch = ()=>{
    const q = input.value.trim().toLowerCase();
    const idx = buildSearchIndex();
    const results = q ? idx.filter(r=> r.label.toLowerCase().includes(q) || (r.meta||'').toLowerCase().includes(q)).slice(0,40) : idx.slice(0,20);
    const groups = {};
    results.forEach(r=>{ groups[r.group]=groups[r.group]||[]; groups[r.group].push(r); });
    const resEl = document.getElementById('searchResults');
    resEl.innerHTML = Object.keys(groups).length ? Object.keys(groups).map(g=>
      '<div class="search-group-label">'+g+'</div>'+groups[g].map(r=>'<div class="search-result" data-goto="'+r.goto+'">'+icon(r.icon)+'<div><div style="font-weight:700; font-size:13px;">'+escapeHtml(r.label)+'</div><div class="search-result-meta">'+escapeHtml(r.meta)+'</div></div></div>').join('')
    ).join('') : '<div class="empty-state" style="padding:30px;">'+icon('search','icon-lg')+'<h4>No matches.</h4><p>Try a different name or keyword.</p></div>';
    resEl.querySelectorAll('.search-result').forEach(el=> el.onclick=()=>{ closeSearch(); goTo(el.getAttribute('data-goto')); });
  };
  input.addEventListener('input', debounce(runSearch,120));
  runSearch();
}
function closeSearch(){ document.getElementById('search-overlay').classList.remove('open'); }
document.getElementById('searchOverlay').addEventListener('click', closeSearch);
