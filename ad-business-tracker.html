<title>Ad Business Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: dark;
  --bg:#080808;
  --bg2:#111111;
  --card:#171717;
  --card2:#1c1c1c;
  --border:#292929;
  --border-soft:#202020;
  --yellow:#FFD400;
  --gold:#F5B800;
  --text:#FFFFFF;
  --text2:#A7A7A7;
  --text3:#6f6f6f;
  --success:#0ca30c;
  --success-bg:rgba(12,163,12,.14);
  --warning:#fab219;
  --warning-bg:rgba(250,178,25,.14);
  --danger:#e0455c;
  --danger-bg:rgba(224,69,92,.14);
  --serious:#ec835a;
  --c1:#3987e5; --c2:#d95926; --c3:#199e70; --c4:#c98500;
  --c5:#d55181; --c6:#3fae3f; --c7:#9085e9; --c8:#e66767;
  --radius:14px;
  --radius-sm:9px;
  --shadow: 0 1px 0 rgba(255,255,255,.02) inset, 0 10px 30px rgba(0,0,0,.35);
  --sidebar-w:248px;
  --sidebar-w-collapsed:76px;
  font-family:'Manrope',system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:'Manrope',system-ui,-apple-system,"Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
.num{font-family:'IBM Plex Mono',ui-monospace,monospace; font-variant-numeric:tabular-nums; letter-spacing:-0.01em;}
h1,h2,h3,h4{margin:0; font-weight:800; letter-spacing:-.01em; text-wrap:balance;}
p{margin:0;}
a{color:inherit;}
button{font-family:inherit;}
::-webkit-scrollbar{width:10px; height:10px;}
::-webkit-scrollbar-thumb{background:#232323; border-radius:8px; border:2px solid var(--bg);}
::-webkit-scrollbar-track{background:transparent;}
.icon{width:18px; height:18px; flex:none;}
.icon-sm{width:14px;height:14px;}
.icon-lg{width:22px;height:22px;}

/* ---------- Shell ---------- */
#app-shell{display:flex; min-height:100%; background:var(--bg);}
#sidebar{
  width:var(--sidebar-w); flex:none; background:var(--bg2); border-right:1px solid var(--border-soft);
  display:flex; flex-direction:column; height:100vh; position:sticky; top:0; transition:width .18s ease;
  z-index:40;
}
#sidebar.collapsed{width:var(--sidebar-w-collapsed);}
.brand{display:flex; align-items:center; gap:10px; padding:20px 18px; border-bottom:1px solid var(--border-soft); min-height:32px;}
.brand-mark{width:32px; height:32px; border-radius:9px; background:linear-gradient(155deg,var(--yellow),var(--gold)); display:flex; align-items:center; justify-content:center; flex:none; font-weight:800; color:#0a0a0a; font-size:15px;}
.brand-text{display:flex; flex-direction:column; overflow:hidden; white-space:nowrap;}
.brand-text b{font-size:13.5px; letter-spacing:.02em; font-weight:800;}
.brand-text span{font-size:10px; color:var(--text3); text-transform:uppercase; letter-spacing:.09em; font-weight:700;}
#sidebar.collapsed .brand-text{display:none;}
.sidebar-collapse-btn{margin-left:auto; background:none; border:none; color:var(--text3); cursor:pointer; padding:4px; border-radius:6px; display:flex;}
.sidebar-collapse-btn:hover{background:#1e1e1e; color:var(--text);}
#sidebar.collapsed .sidebar-collapse-btn{display:none;}
nav.navlist{flex:1; overflow-y:auto; padding:10px 10px 10px;}
.nav-item{
  display:flex; align-items:center; gap:12px; padding:9px 12px; border-radius:10px; color:var(--text2);
  cursor:pointer; font-size:13.5px; font-weight:600; margin-bottom:2px; white-space:nowrap; overflow:hidden;
  border:1px solid transparent; position:relative;
}
.nav-item .icon{color:var(--text3);}
.nav-item:hover{background:#1a1a1a; color:var(--text);}
.nav-item:hover .icon{color:var(--text2);}
.nav-item.active{background:rgba(255,212,0,.09); color:var(--yellow); border-color:rgba(255,212,0,.18);}
.nav-item.active .icon{color:var(--yellow);}
.nav-badge{margin-left:auto; background:var(--danger); color:#fff; font-size:10px; font-weight:800; padding:1px 6px; border-radius:20px;}
#sidebar.collapsed .nav-item span.label{display:none;}
#sidebar.collapsed .nav-badge{position:absolute; top:2px; right:2px; margin:0; width:8px; height:8px; padding:0; border-radius:50%; font-size:0;}
#sidebar.collapsed .nav-item{justify-content:center;}
.sidebar-foot{padding:12px; border-top:1px solid var(--border-soft); font-size:11px; color:var(--text3); white-space:nowrap; overflow:hidden;}
#sidebar.collapsed .sidebar-foot{display:none;}

#main{flex:1; min-width:0; display:flex; flex-direction:column; min-height:100vh;}
#topbar{
  position:sticky; top:0; z-index:30; background:rgba(8,8,8,.86); backdrop-filter:blur(10px);
  border-bottom:1px solid var(--border-soft); padding:16px 26px; display:flex; align-items:center; gap:16px; flex-wrap:wrap;
}
.hamburger{display:none; background:none; border:1px solid var(--border); color:var(--text2); border-radius:9px; padding:8px; cursor:pointer;}
.greeting{display:flex; flex-direction:column; margin-right:auto;}
.greeting h1{font-size:19px;}
.greeting p{color:var(--text2); font-size:12.5px; margin-top:2px;}
.topbar-actions{display:flex; align-items:center; gap:10px; flex-wrap:wrap;}

.btn{
  display:inline-flex; align-items:center; gap:7px; border-radius:10px; border:1px solid var(--border); background:var(--card);
  color:var(--text); font-size:12.8px; font-weight:700; padding:9px 14px; cursor:pointer; transition:.12s;
  white-space:nowrap;
}
.btn:hover{border-color:#3a3a3a; background:#1d1d1d;}
.btn:active{transform:translateY(1px);}
.btn-primary{background:var(--yellow); border-color:var(--yellow); color:#0a0900;}
.btn-primary:hover{background:var(--gold); border-color:var(--gold);}
.btn-ghost{background:transparent; border-color:transparent;}
.btn-ghost:hover{background:#1a1a1a;}
.btn-danger{color:var(--danger); border-color:rgba(224,69,92,.35);}
.btn-danger:hover{background:var(--danger-bg);}
.btn-sm{padding:6px 10px; font-size:12px; border-radius:8px;}
.btn-icon{padding:8px; border-radius:9px;}
.btn:disabled{opacity:.45; cursor:not-allowed;}

.select, .input, .textarea{
  background:#101010; border:1px solid var(--border); color:var(--text); border-radius:9px; padding:9px 11px; font-size:12.8px;
  font-family:inherit; width:100%; outline:none;
}
.select:focus, .input:focus, .textarea:focus{border-color:var(--yellow);}
.textarea{resize:vertical; min-height:64px;}
select.select{appearance:none; background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23A7A7A7' stroke-width='2'><path d='M6 9l6 6 6-6'/></svg>"); background-repeat:no-repeat; background-position:right 10px center; padding-right:30px;}
label.field-label{font-size:11.5px; font-weight:700; color:var(--text2); text-transform:uppercase; letter-spacing:.05em; display:block; margin-bottom:6px;}
.field{margin-bottom:14px;}
.field-hint{font-size:11px; color:var(--text3); margin-top:5px;}
.check-row{display:flex; align-items:center; gap:8px; font-size:12.8px; color:var(--text);}
.check-row input{width:16px;height:16px; accent-color:var(--yellow);}

#content{padding:24px 26px 90px; flex:1;}
.page-head{display:flex; align-items:flex-start; justify-content:space-between; gap:16px; margin-bottom:20px; flex-wrap:wrap;}
.page-head h2{font-size:20px;}
.page-head .sub{color:var(--text2); font-size:12.8px; margin-top:4px;}
.toolbar{display:flex; align-items:center; gap:8px; flex-wrap:wrap;}

.grid{display:grid; gap:14px;}
.kpi-grid{grid-template-columns:repeat(4,minmax(0,1fr));}
.grid-2{grid-template-columns:repeat(2,minmax(0,1fr));}
.grid-3{grid-template-columns:repeat(3,minmax(0,1fr));}
@media (max-width:1180px){.kpi-grid{grid-template-columns:repeat(2,minmax(0,1fr));} .grid-3{grid-template-columns:repeat(2,minmax(0,1fr));}}
@media (max-width:640px){.kpi-grid, .grid-2, .grid-3{grid-template-columns:1fr;}}

.card{
  background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:18px; box-shadow:var(--shadow);
}
.card.pad-lg{padding:22px;}
.card-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; gap:10px;}
.card-head h3{font-size:14px;}
.card-head .sub{font-size:11.5px; color:var(--text3); font-weight:600;}

.kpi{position:relative; overflow:hidden;}
.kpi .k-label{font-size:11px; font-weight:700; color:var(--text2); text-transform:uppercase; letter-spacing:.06em; display:flex; align-items:center; gap:6px;}
.kpi .k-value{font-size:26px; font-weight:800; margin-top:10px; letter-spacing:-.02em;}
.kpi .k-delta{margin-top:8px; font-size:12px; font-weight:700; display:flex; align-items:center; gap:4px;}
.k-delta.up{color:var(--success);} .k-delta.down{color:var(--danger);} .k-delta.flat{color:var(--text3);}
.kpi .k-tip{color:var(--text3); cursor:help;}

.badge{display:inline-flex; align-items:center; gap:5px; font-size:10.8px; font-weight:800; padding:3px 9px; border-radius:20px; text-transform:uppercase; letter-spacing:.03em; white-space:nowrap;}
.badge-success{color:var(--success); background:var(--success-bg);}
.badge-warning{color:var(--warning); background:var(--warning-bg);}
.badge-danger{color:var(--danger); background:var(--danger-bg);}
.badge-neutral{color:var(--text2); background:#232323;}
.badge-info{color:var(--c1); background:rgba(57,135,229,.14);}
.dot{width:7px; height:7px; border-radius:50%; background:currentColor; flex:none;}

.table-wrap{overflow-x:auto; border:1px solid var(--border); border-radius:var(--radius);}
table.tbl{width:100%; border-collapse:collapse; font-size:12.6px; min-width:640px;}
table.tbl thead th{
  text-align:left; font-size:10.6px; text-transform:uppercase; letter-spacing:.05em; color:var(--text3); font-weight:800;
  padding:11px 14px; background:var(--bg2); border-bottom:1px solid var(--border); white-space:nowrap; position:sticky; top:0;
}
table.tbl tbody td{padding:11px 14px; border-bottom:1px solid var(--border-soft); vertical-align:middle;}
table.tbl tbody tr:last-child td{border-bottom:none;}
table.tbl tbody tr:hover{background:#1b1b1b;}
.row-actions{display:flex; gap:4px; justify-content:flex-end;}
.cell-strong{font-weight:700;}
.cell-muted{color:var(--text3);}
.cell-num{font-family:'IBM Plex Mono',monospace; font-variant-numeric:tabular-nums;}

.empty-state{display:flex; flex-direction:column; align-items:center; text-align:center; padding:56px 20px; color:var(--text2); gap:10px;}
.empty-state .icon{width:34px; height:34px; color:var(--text3);}
.empty-state h4{font-size:15px; color:var(--text);}
.empty-state p{font-size:12.8px; max-width:340px;}

.progress-track{height:9px; background:#232323; border-radius:20px; overflow:hidden;}
.progress-fill{height:100%; border-radius:20px; background:linear-gradient(90deg,var(--gold),var(--yellow));}
.progress-fill.danger{background:var(--danger);}
.progress-fill.warning{background:var(--warning);}

.tabs{display:flex; gap:4px; background:#101010; border:1px solid var(--border); border-radius:10px; padding:3px;}
.tab-btn{padding:7px 13px; font-size:12px; font-weight:700; color:var(--text2); border-radius:8px; cursor:pointer; border:none; background:none;}
.tab-btn.active{background:var(--card); color:var(--yellow);}

.filter-bar{display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:14px;}
.filter-bar .select, .filter-bar .input{width:auto; min-width:130px;}
.search-input-wrap{position:relative; display:flex; align-items:center;}
.search-input-wrap .icon{position:absolute; left:11px; color:var(--text3);}
.search-input-wrap input{padding-left:34px; min-width:190px;}

/* Modal */
#modal-root{position:fixed; inset:0; z-index:100; display:none;}
#modal-root.open{display:block;}
.modal-overlay{position:absolute; inset:0; background:rgba(0,0,0,.6); backdrop-filter:blur(2px);}
.modal-panel{
  position:relative; max-width:560px; width:92%; margin:6vh auto 0; background:var(--bg2); border:1px solid var(--border);
  border-radius:16px; box-shadow:0 20px 60px rgba(0,0,0,.55); max-height:88vh; display:flex; flex-direction:column;
}
.modal-panel.wide{max-width:760px;}
.modal-head{display:flex; align-items:center; justify-content:space-between; padding:18px 22px; border-bottom:1px solid var(--border-soft);}
.modal-head h3{font-size:15.5px;}
.modal-body{padding:20px 22px; overflow-y:auto; flex:1 1 auto; min-height:0;}
.modal-foot{padding:16px 22px; border-top:1px solid var(--border-soft); display:flex; justify-content:flex-end; gap:8px;}
.form-grid{display:grid; grid-template-columns:1fr 1fr; gap:0 14px;}
.form-grid .span-2{grid-column:1/-1;}
@media (max-width:560px){.form-grid{grid-template-columns:1fr;}}

/* Toast */
#toast-root{position:fixed; bottom:22px; right:22px; z-index:200; display:flex; flex-direction:column; gap:8px; align-items:flex-end;}
.toast{background:var(--card); border:1px solid var(--border); border-radius:11px; padding:11px 16px; font-size:12.6px; font-weight:600; box-shadow:var(--shadow); display:flex; align-items:center; gap:9px; max-width:320px; animation:toastIn .18s ease;}
.toast.success{border-color:rgba(12,163,12,.4);} .toast.success .icon{color:var(--success);}
.toast.error{border-color:rgba(224,69,92,.4);} .toast.error .icon{color:var(--danger);}
@keyframes toastIn{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;}}

/* Quick add fab */
#quick-add-fab{
  position:fixed; bottom:22px; right:22px; z-index:60; background:var(--yellow); color:#0a0900; border:none; border-radius:50%;
  width:52px; height:52px; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:13px; cursor:pointer;
  box-shadow:0 10px 28px rgba(255,212,0,.3); transition:.15s;
}
#quick-add-fab:hover{background:var(--gold); transform:translateY(-1px) scale(1.04);}
#quick-add-fab .icon{width:22px; height:22px;}
#quick-add-menu{position:fixed; bottom:78px; right:22px; z-index:61; background:var(--bg2); border:1px solid var(--border); border-radius:14px; padding:8px; box-shadow:0 20px 50px rgba(0,0,0,.5); display:none; min-width:210px;}
#quick-add-menu.open{display:block;}
.qa-item{display:flex; align-items:center; gap:10px; padding:9px 11px; border-radius:9px; cursor:pointer; font-size:12.8px; font-weight:700;}
.qa-item:hover{background:#1e1e1e;}
.qa-item .icon{color:var(--yellow);}

/* Search overlay */
#search-overlay{position:fixed; inset:0; z-index:120; display:none;}
#search-overlay.open{display:block;}
.search-panel{max-width:560px; margin:8vh auto 0; background:var(--bg2); border:1px solid var(--border); border-radius:16px; width:92%; overflow:hidden; box-shadow:0 20px 60px rgba(0,0,0,.55);}
.search-panel-input{display:flex; align-items:center; gap:10px; padding:16px 18px; border-bottom:1px solid var(--border-soft);}
.search-panel-input input{flex:1; background:none; border:none; outline:none; color:var(--text); font-size:14px; font-family:inherit;}
.search-results{max-height:56vh; overflow-y:auto; padding:8px;}
.search-result{display:flex; align-items:center; gap:11px; padding:10px 12px; border-radius:10px; cursor:pointer;}
.search-result:hover{background:#1e1e1e;}
.search-result .icon{color:var(--text3);}
.search-result-meta{font-size:11px; color:var(--text3);}
.search-group-label{font-size:10.5px; text-transform:uppercase; letter-spacing:.06em; font-weight:800; color:var(--text3); padding:10px 12px 4px;}

/* Alerts list */
.alert-row{display:flex; gap:12px; align-items:flex-start; padding:13px 14px; border-radius:12px; border:1px solid var(--border); background:var(--card2); cursor:pointer;}
.alert-row:hover{border-color:#3a3a3a;}
.alert-row + .alert-row{margin-top:8px;}
.alert-icon{width:32px; height:32px; border-radius:9px; display:flex; align-items:center; justify-content:center; flex:none;}
.alert-icon.URGENT{background:var(--danger-bg); color:var(--danger);}
.alert-icon.WARNING{background:var(--warning-bg); color:var(--warning);}
.alert-icon.INFO{background:rgba(57,135,229,.14); color:var(--c1);}
.alert-icon.GOOD{background:var(--success-bg); color:var(--success);}
.alert-title{font-weight:700; font-size:13px;}
.alert-desc{font-size:12px; color:var(--text2); margin-top:2px;}
.alert-dismiss{margin-left:auto; flex:none;}

/* Chart bits */
.chart-legend{display:flex; gap:14px; flex-wrap:wrap; margin-top:10px;}
.legend-item{display:flex; align-items:center; gap:6px; font-size:11.5px; color:var(--text2); font-weight:600;}
.legend-swatch{width:10px; height:10px; border-radius:3px;}
.chart-tooltip{position:absolute; background:#0d0d0d; border:1px solid var(--border); border-radius:9px; padding:8px 11px; font-size:11.5px; pointer-events:none; z-index:5; box-shadow:0 8px 22px rgba(0,0,0,.5); white-space:nowrap;}
.chart-empty{display:flex; align-items:center; justify-content:center; height:220px; color:var(--text3); font-size:12.5px;}

.pill-tabs{display:flex; gap:6px; flex-wrap:wrap;}
.pill{padding:6px 12px; border-radius:20px; background:#101010; border:1px solid var(--border); color:var(--text2); font-size:11.6px; font-weight:700; cursor:pointer;}
.pill.active{background:rgba(255,212,0,.12); color:var(--yellow); border-color:rgba(255,212,0,.3);}

.demo-flag{color:var(--text3); font-size:10px; font-weight:800; border:1px dashed var(--border); padding:1px 6px; border-radius:6px; text-transform:uppercase; letter-spacing:.04em;}
.divider{height:1px; background:var(--border-soft); margin:16px 0;}
.mini-stat{display:flex; flex-direction:column; gap:3px;}
.mini-stat .lbl{font-size:10.8px; color:var(--text3); font-weight:700; text-transform:uppercase; letter-spacing:.04em;}
.mini-stat .val{font-size:16px; font-weight:800;}
.list-plain{display:flex; flex-direction:column; gap:2px;}
.list-row{display:flex; align-items:center; justify-content:space-between; padding:10px 4px; border-bottom:1px solid var(--border-soft); gap:10px;}
.list-row:last-child{border-bottom:none;}
.avatar{width:30px; height:30px; border-radius:9px; background:#232323; display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:800; color:var(--text2); flex:none;}
.pagination{display:flex; align-items:center; justify-content:flex-end; gap:10px; padding:10px 4px; font-size:12px; color:var(--text2);}

.settings-section{margin-bottom:26px;}
.settings-section h3{font-size:14px; margin-bottom:4px;}
.settings-section .sub{color:var(--text3); font-size:12px; margin-bottom:14px;}
.tag-chip{display:inline-flex; align-items:center; gap:6px; background:#101010; border:1px solid var(--border); padding:6px 10px; border-radius:20px; font-size:12px; font-weight:700; margin:0 6px 6px 0;}
.tag-chip button{background:none; border:none; color:var(--text3); cursor:pointer; display:flex; padding:0;}
.tag-chip button:hover{color:var(--danger);}
.category-cost-type{font-size:10.5px; color:var(--text3); font-weight:600;}

@media (max-width:860px){
  #content .grid{grid-template-columns:1fr !important;}
}
@media (max-width:900px){
  #sidebar{position:fixed; left:0; top:0; height:100vh; transform:translateX(-100%); transition:transform .2s ease; box-shadow:0 0 0 2000px rgba(0,0,0,0);}
  #sidebar.mobile-open{transform:translateX(0); box-shadow:0 0 0 2000px rgba(0,0,0,.5);}
  #sidebar.collapsed{width:var(--sidebar-w);}
  #sidebar.collapsed .brand-text, #sidebar.collapsed .nav-item span.label{display:block;}
  .sidebar-collapse-btn{display:none;}
  .hamburger{display:flex;}
  #content{padding:18px 14px 90px;}
  #topbar{padding:12px 14px;}
  .greeting h1{font-size:16px;}
}

/* ---- Login gate ---- */
#app-shell{display:none;}
#app-shell.unlocked{display:flex;}
.login-gate{position:fixed;inset:0;z-index:99999;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 20%, #151515 0%, #080808 65%);padding:20px;}
.login-gate.hidden{display:none;}
.login-card{width:100%;max-width:360px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:32px 28px;text-align:center;}
.login-card .brand-mark{width:44px;height:44px;border-radius:11px;background:var(--yellow);color:#151300;font-weight:800;font-size:20px;display:flex;align-items:center;justify-content:center;margin:0 auto 16px;}
.login-card h2{font-size:17px;font-weight:700;margin:0 0 4px;}
.login-card p{color:var(--text2);font-size:13px;margin:0 0 20px;}
.login-card input{width:100%;box-sizing:border-box;background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text);padding:11px 13px;font-size:14px;font-family:inherit;margin-bottom:10px;outline:none;}
.login-card input:focus{border-color:var(--yellow);}
.login-card button{width:100%;background:var(--yellow);color:#151300;border:none;border-radius:var(--radius-sm);padding:11px;font-size:14px;font-weight:700;font-family:inherit;cursor:pointer;margin-top:4px;}
.login-card button:hover{background:var(--gold);}

/* =========================================================================

function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
function pad2(n){ return n<10?'0'+n:''+n; }
function todayStr(){ const d=new Date(); return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }
function monthKey(dateStr){ return (dateStr||todayStr()).slice(0,7); }
function parseDate(s){ if(!s) return null; const p=s.split('-'); return new Date(+p[0], +p[1]-1, +p[2]||1); }
function toDateStr(d){ return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }
function addDays(dateStr, n){ const d=parseDate(dateStr); d.setDate(d.getDate()+n); return toDateStr(d); }
function safeNum(v){ const n = typeof v==='number'?v:parseFloat(v); return Number.isFinite(n)?n:0; }
function safeDiv(a,b){ a=safeNum(a); b=safeNum(b); return b?a/b:0; }
function clamp(n,min,max){ return Math.max(min,Math.min(max,n)); }
function round0(n){ return Math.round(safeNum(n)); }
function escapeHtml(s){ return (s==null?'':String(s)).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function currencySymbol(){ return (Settings().currencySymbol)||'₱'; }
function s_currCode(){ return (Settings().currencyCode)||'PHP'; }
function fmtMoney(n, opts){
  opts=opts||{};
  n = safeNum(n);
  const neg = n<0; n = Math.abs(n);
  const dec = opts.decimals!=null?opts.decimals:0;
  const s = n.toLocaleString('en-PH',{minimumFractionDigits:dec, maximumFractionDigits:dec});
  return (neg?'-':'')+currencySymbol()+s;
}
function fmtNum(n,dec){ n=safeNum(n); return n.toLocaleString('en-PH',{minimumFractionDigits:dec||0,maximumFractionDigits:dec!=null?dec:2}); }
function fmtPct(n, dec){ n=safeNum(n); if(!Number.isFinite(n)) n=0; return (n*100).toFixed(dec!=null?dec:1)+'%'; }
function fmtDate(s){ if(!s) return '—'; const d=parseDate(s); if(!d||isNaN(d)) return '—'; return d.toLocaleDateString('en-PH',{month:'short',day:'numeric',year:'numeric'}); }
function fmtDateShort(s){ if(!s) return '—'; const d=parseDate(s); if(!d||isNaN(d)) return '—'; return d.toLocaleDateString('en-PH',{month:'short',day:'numeric'}); }
function fmtMonthLabel(mk){ const d=parseDate(mk+'-01'); return d.toLocaleDateString('en-PH',{month:'short',year:'numeric'}); }
function daysBetween(a,b){ const da=parseDate(a), db=parseDate(b); return Math.round((db-da)/86400000); }
function debounce(fn,ms){ let t; return function(...a){ clearTimeout(t); t=setTimeout(()=>fn.apply(this,a),ms); }; }
function pctChangeLabel(curr,prev){
  curr=safeNum(curr); prev=safeNum(prev);
  if(prev===0){ if(curr===0) return {cls:'flat',text:'No change'}; return {cls:'up',text:'New activity'}; }
  const c=(curr-prev)/Math.abs(prev);
  const cls = c>0.001?'up':(c<-0.001?'down':'flat');
  return {cls, text:(c>=0?'+':'')+fmtPct(c)+' vs last period'};
}
function initials(name){ if(!name) return '?'; const p=name.trim().split(/\s+/); return ((p[0]||'')[0]||'')+((p[1]||'')[0]||''); }

function DB_load(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){ STATE = JSON.parse(raw); if(!STATE.settings) STATE.settings=freshState().settings; return; }
  }catch(e){ console.warn('Could not read saved data, starting fresh.', e); }
  STATE = freshState();
  seedDemoData(STATE);
  DB_save();
}
function DB_save(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(STATE)); }
  catch(e){ toast('Could not save changes — your browser storage may be full.', 'error'); }
}
function Settings(){ return STATE.settings; }

function nowRecord(extra){ const t=Date.now(); return Object.assign({id:uid(), created_at:t, updated_at:t, deleted:false}, extra); }
function touch(rec){ rec.updated_at = Date.now(); }

const Entities = {
  list(col){ return (STATE[col]||[]).filter(r=>!r.deleted); },
  get(col,id){ return (STATE[col]||[]).find(r=>r.id===id && !r.deleted); },
  create(col, data){ const rec = nowRecord(data); STATE[col].push(rec); DB_save(); return rec; },
  update(col, id, patch){ const rec = STATE[col].find(r=>r.id===id); if(!rec) return null; Object.assign(rec, patch); touch(rec); DB_save(); return rec; },
  softDelete(col, id){ const rec = STATE[col].find(r=>r.id===id); if(!rec) return; rec.deleted=true; touch(rec); DB_save(); },
  duplicate(col, id){ const rec = Entities.get(col,id); if(!rec) return null; const copy = nowRecord(Object.assign({}, rec, {id:undefined})); delete copy.id; const r2=nowRecord(copy); STATE[col].push(r2); DB_save(); return r2; }
};

/* =========================================================================
   5. CALCULATION ENGINE
   ========================================================================= */
function inRange(dateStr, start, end){ return dateStr>=start && dateStr<=end; }

function Calc_saleGross(s){ return safeNum(s.qty)*safeNum(s.price) - safeNum(s.discount); }
function Calc_saleNet(s){ return Calc_saleGross(s) - safeNum(s.paymentFee) - safeNum(s.refund); }
function Calc_saleProfit(s){ return Calc_saleGross(s) - safeNum(s.directCost) - safeNum(s.paymentFee) - safeNum(s.refund); }
function Calc_saleBalance(s){ return Math.max(0, Calc_saleGross(s) - safeNum(s.refund) - safeNum(s.amountPaid)); }
function Calc_saleStatus(s){
  const bal = Calc_saleBalance(s);
  if(bal<=0.5) return 'Paid';
  if(s.dueDate && s.dueDate < todayStr() && safeNum(s.amountPaid)===0) return 'Overdue';
  if(s.dueDate && s.dueDate < todayStr()) return 'Overdue';
  if(safeNum(s.amountPaid)>0) return 'Partial';
  return 'Pending';
}
function categoryOf(id){ return Entities.get('expenseCategories', id); }
function offerOf(id){ return Entities.get('offers', id); }
function clientOf(id){ return Entities.get('clients', id); }
function accountOf(id){ return Entities.get('cashAccounts', id); }
function memberOf(id){ return Entities.get('teamMembers', id); }

// Unified expense-line view: manual expenses (non pass-through) + ad spend + payroll payments.
function getAllExpenseLines(range){
  const lines = [];
  Entities.list('expenses').forEach(e=>{
    if(e.reimbursable) return;
    const cat = categoryOf(e.categoryId);
    lines.push({ id:'exp_'+e.id, date:e.date, name:e.name, categoryName: cat?cat.name:'Uncategorized',
      costType: cat?cat.costType:'other', behavior: cat?cat.behavior:'variable', amount:safeNum(e.amount), account:e.account, source:'manual', ref:e });
  });
  Entities.list('campaigns').forEach(c=>{
    lines.push({ id:'ad_'+c.id, date:c.date, name:c.campaignName||c.platform, categoryName:c.platform,
      costType:'advertising', behavior:'variable', amount:safeNum(c.adSpend), account:c.account, source:'advertising', ref:c });
  });
  Entities.list('payroll').forEach(p=>{
    const m = memberOf(p.teamMemberId);
    lines.push({ id:'pr_'+p.id, date:p.date, name:(m?m.name:'Team member')+' — '+p.type, categoryName:'Team Payroll',
      costType:'payroll', behavior: (m && m.paymentType==='Monthly Salary') ? 'fixed':'variable', amount:safeNum(p.amount), account:p.account, source:'payroll', ref:p });
  });
  if(range) return lines.filter(l=>inRange(l.date, range.start, range.end));
  return lines;
}

function Calc_period(range){
  const sales = Entities.list('sales').filter(s=>inRange(s.date, range.start, range.end));
  const refundsInRange = Entities.list('sales').filter(s=> s.refund>0 && s.refundDate && inRange(s.refundDate, range.start, range.end));
  const grossRevenue = sales.reduce((a,s)=>a+Calc_saleGross(s),0);
  const refundsTotal = refundsInRange.reduce((a,s)=>a+safeNum(s.refund),0);
  const netRevenue = grossRevenue - refundsTotal;
  const directCosts = sales.reduce((a,s)=>a+safeNum(s.directCost),0);
  const paymentFees = sales.reduce((a,s)=>a+safeNum(s.paymentFee),0);
  const grossProfit = netRevenue - directCosts - paymentFees;

  const lines = getAllExpenseLines(range);
  const adSpend = lines.filter(l=>l.costType==='advertising').reduce((a,l)=>a+l.amount,0);
  const payrollCost = lines.filter(l=>l.costType==='payroll').reduce((a,l)=>a+l.amount,0);
  const opexCost = lines.filter(l=>l.costType==='opex').reduce((a,l)=>a+l.amount,0);
  const otherCost = lines.filter(l=>l.costType==='other'||l.costType==='direct').reduce((a,l)=>a+l.amount,0);
  const totalExpenses = adSpend+payrollCost+opexCost+otherCost+directCosts+paymentFees;

  const netProfit = grossProfit - opexCost - adSpend - payrollCost - otherCost;
  const campaigns = Entities.list('campaigns').filter(c=>inRange(c.date, range.start, range.end));
  const revenueFromAds = campaigns.reduce((a,c)=>a+safeNum(c.revenueGenerated),0);
  const totalMessages = campaigns.reduce((a,c)=>a+safeNum(c.messages),0);
  const totalPurchases = campaigns.reduce((a,c)=>a+safeNum(c.purchases),0);

  const cashCollected = sales.reduce((a,s)=>a+safeNum(s.amountPaid),0) +
    Entities.list('sales').filter(s=> !inRange(s.date,range.start,range.end)).reduce((a,s)=>0+a,0); // amount-paid-on-sale-date simplification

  return {
    sales, grossRevenue, refundsTotal, netRevenue, directCosts, paymentFees, grossProfit,
    adSpend, payrollCost, opexCost, otherCost, totalExpenses, netProfit,
    revenueFromAds, totalMessages, totalPurchases, campaigns,
    roasBlended: safeDiv(netRevenue, adSpend),
    roasAttributed: safeDiv(revenueFromAds, adSpend),
    cpm: safeDiv(adSpend, totalMessages),
    cpp: safeDiv(adSpend, totalPurchases),
    netMargin: safeDiv(netProfit, netRevenue),
    grossMargin: safeDiv(grossProfit, netRevenue),
    aov: safeDiv(grossRevenue, sales.length),
    expenseRatio: safeDiv(totalExpenses, netRevenue),
    adSpendPct: safeDiv(adSpend, netRevenue),
    cashCollected,
    lines,
  };
}

function Calc_outstandingReceivables(){
  return Entities.list('sales').filter(s=>Calc_saleBalance(s)>0.5);
}

function Calc_cashAccountBalance(accId){
  const acc = accountOf(accId); if(!acc) return 0;
  let bal = safeNum(acc.openingBalance);
  Entities.list('sales').forEach(s=>{ if(s.account===accId){ bal += safeNum(s.amountPaid); } if(s.refund>0 && s.account===accId){ bal -= safeNum(s.refund); } });
  getAllExpenseLines().forEach(l=>{ if(l.account===accId) bal -= l.amount; });
  Entities.list('accountTransactions').forEach(t=>{
    const amt = safeNum(t.amount);
    if(t.toAccount===accId && ['Transfer','Capital In','Loan In'].includes(t.type)) bal += amt;
    if(t.fromAccount===accId && ['Transfer',"Owner's Draw",'Loan Out'].includes(t.type)) bal -= amt;
  });
  return bal;
}
function Calc_cashAccountMoveDates(accId){
  const dates=[];
  Entities.list('sales').forEach(s=>{ if(s.account===accId) dates.push(s.date); });
  getAllExpenseLines().forEach(l=>{ if(l.account===accId) dates.push(l.date); });
  Entities.list('accountTransactions').forEach(t=>{ if(t.toAccount===accId||t.fromAccount===accId) dates.push(t.date); });
  dates.sort();
  return dates.length?dates[dates.length-1]:null;
}
function Calc_cashAccountFlow(accId, range){
  let inAmt=0, outAmt=0;
  Entities.list('sales').forEach(s=>{
    if(s.account===accId && inRange(s.date,range.start,range.end)) inAmt += safeNum(s.amountPaid);
    if(s.account===accId && s.refund>0 && s.refundDate && inRange(s.refundDate,range.start,range.end)) outAmt += safeNum(s.refund);
  });
  getAllExpenseLines(range).forEach(l=>{ if(l.account===accId) outAmt += l.amount; });
  Entities.list('accountTransactions').forEach(t=>{
    if(!inRange(t.date,range.start,range.end)) return;
    const amt = safeNum(t.amount);
    if(t.toAccount===accId && ['Transfer','Capital In','Loan In'].includes(t.type)) inAmt+=amt;
    if(t.fromAccount===accId && ['Transfer',"Owner's Draw",'Loan Out'].includes(t.type)) outAmt+=amt;
  });
  return {inAmt, outAmt};
}

function Calc_clientTotals(clientId){
  const sales = Entities.list('sales').filter(s=>s.clientId===clientId);
  const totalContractValue = sales.reduce((a,s)=>a+Calc_saleGross(s),0);
  const amountPaid = sales.reduce((a,s)=>a+safeNum(s.amountPaid),0);
  const remainingBalance = sales.reduce((a,s)=>a+Calc_saleBalance(s),0);
  let paymentStatus = 'Pending';
  if(sales.length===0) paymentStatus='—';
  else if(remainingBalance<=0.5) paymentStatus='Paid';
  else if(amountPaid>0) paymentStatus='Partial';
  if(sales.some(s=>Calc_saleStatus(s)==='Overdue')) paymentStatus='Overdue';
  return {totalContractValue, amountPaid, remainingBalance, paymentStatus, salesCount:sales.length};
}

function Calc_memberAmounts(memberId){
  const m = memberOf(memberId); if(!m) return {due:0,paidThisMonth:0,remaining:0,lastPayment:null};
  const mk = monthKey(todayStr());
  const payments = Entities.list('payroll').filter(p=>p.teamMemberId===memberId);
  const paidThisMonth = payments.filter(p=>monthKey(p.date)===mk).reduce((a,p)=>a+safeNum(p.amount),0);
  let due = 0;
  if(m.paymentType==='Monthly Salary') due = safeNum(m.monthlySalary);
  else if(m.paymentType==='Commission'){
    const sales = Entities.list('sales').filter(s=> monthKey(s.date)===mk);
    const attributed = sales.reduce((a,s)=>a+Calc_saleNet(s),0) * (safeNum(m.commissionPct)/100);
    due = attributed;
  } else { due = paidThisMonth; }
  const remaining = Math.max(0, due - paidThisMonth);
  const lastPayment = payments.length ? payments.map(p=>p.date).sort().slice(-1)[0] : null;
  return {due, paidThisMonth, remaining, lastPayment};
}

function Calc_breakeven(range){
  const lines = getAllExpenseLines(range);
  const fixed = lines.filter(l=>l.behavior==='fixed').reduce((a,l)=>a+l.amount,0);
  const p = Calc_period(range);
  const contributionMargin = safeDiv(p.grossProfit, p.netRevenue);
  const breakEvenRevenue = contributionMargin>0 ? fixed/contributionMargin : 0;
  const avgOrder = p.aov||1;
  const salesNeeded = contributionMargin>0 ? Math.ceil(safeDiv(breakEvenRevenue, avgOrder)) : 0;
  return { fixed, contributionMargin, breakEvenRevenue, salesNeeded, currentRevenue:p.netRevenue, passed: p.netRevenue>=breakEvenRevenue && breakEvenRevenue>0 };
}

   6. DATE RANGES
   ========================================================================= */
const RANGE_PRESETS = ['Today','Yesterday','This Week','This Month','Last Month','This Quarter','This Year','Custom Range'];
let APP = {
  route: 'dashboard',
  range: null,
  reportsRange: null,
  sidebarCollapsed: false,
  mobileOpen: false,
};

function startOfWeek(d){ const dt=new Date(d); const day=dt.getDay(); const diff=(day===0?-6:1-day); dt.setDate(dt.getDate()+diff); return dt; }
function resolveRange(preset, custom){
  const t = new Date();
  const today = todayStr();
  let start=today, end=today, label=preset;
  switch(preset){
    case 'Today': start=today; end=today; break;
    case 'Yesterday': start=addDays(today,-1); end=addDays(today,-1); break;
    case 'This Week': { const s=startOfWeek(t); start=toDateStr(s); end=today; break; }
    case 'This Month': start=today.slice(0,8)+'01'; end=today; break;
    case 'Last Month': { const d=new Date(t.getFullYear(), t.getMonth()-1, 1); const s=toDateStr(d); const e=new Date(t.getFullYear(),t.getMonth(),0); start=s; end=toDateStr(e); break; }
    case 'This Quarter': { const q=Math.floor(t.getMonth()/3); const s=new Date(t.getFullYear(), q*3, 1); start=toDateStr(s); end=today; break; }
    case 'This Year': start=today.slice(0,4)+'-01-01'; end=today; break;
    case 'Custom Range': start=(custom&&custom.start)||today; end=(custom&&custom.end)||today; break;
    default: start=today.slice(0,8)+'01'; end=today;
  }
  return {preset, start, end, label};
}
function previousEquivalent(range){
  const days = daysBetween(range.start, range.end)+1;
  const end = addDays(range.start, -1);
  const start = addDays(end, -(days-1));
  return {preset:'Previous', start, end};
}
function rangeDisplay(range){
  if(range.preset!=='Custom Range' && range.start===range.end) return fmtDate(range.start);
  return fmtDateShort(range.start)+' – '+fmtDateShort(range.end)+', '+range.end.slice(0,4);
}

function toast(msg, type){
  const root = document.getElementById('toast-root');
  const el = document.createElement('div');
  el.className = 'toast '+(type||'success');
  el.innerHTML = icon(type==='error'?'x':'check')+'<span>'+escapeHtml(msg)+'</span>';
  root.appendChild(el);
  setTimeout(()=>{ el.style.transition='opacity .25s'; el.style.opacity='0'; setTimeout(()=>el.remove(),260); }, 3000);
}

function closeModal(){
  document.getElementById('modal-root').classList.remove('open');
  document.getElementById('modalPanelSlot').innerHTML='';
}
function openModalRaw(html, opts){
  document.getElementById('modalPanelSlot').innerHTML = html;
  document.getElementById('modal-root').classList.add('open');
}
document.getElementById('modalOverlay').addEventListener('click', closeModal);

function confirmDialog(opts){
  return new Promise(resolve=>{
    const html = '<div class="modal-panel" role="dialog">'+
      '<div class="modal-head"><h3>'+escapeHtml(opts.title||'Are you sure?')+'</h3></div>'+
      '<div class="modal-body"><p style="color:var(--text2); font-size:13px; line-height:1.55;">'+escapeHtml(opts.message||'This action cannot be undone.')+'</p></div>'+
      '<div class="modal-foot"><button class="btn" id="cfCancel">Cancel</button><button class="btn '+(opts.danger?'btn-danger':'btn-primary')+'" id="cfOk">'+escapeHtml(opts.okText||'Confirm')+'</button></div>'+
      '</div>';
    openModalRaw(html);
    document.getElementById('cfCancel').onclick = ()=>{ closeModal(); resolve(false); };
    document.getElementById('cfOk').onclick = ()=>{ closeModal(); resolve(true); };
  });
}

/* Generic schema-driven form ---------------------------------------------- */
function optionsForField(f, values){
  if(typeof f.options==='function') return f.options(values||{});
  return f.options||[];
}
function fieldVisible(f, values){ return f.showIf ? !!f.showIf(values) : true; }

function renderFieldHtml(f, values){
  const val = values[f.key]!=null?values[f.key]:(f.default!=null?f.default:'');
  const req = f.required?' <span style="color:var(--danger)">*</span>':'';
  let inner='';
  if(f.type==='select'){
    const opts = optionsForField(f, values);
    inner = '<select class="select" id="ff_'+f.key+'" '+(f.disabled?'disabled':'')+'>'+
      (f.placeholder?'<option value="">'+escapeHtml(f.placeholder)+'</option>':'')+
      opts.map(o=>{ const ov=(typeof o==='object')?o.value:o; const ol=(typeof o==='object')?o.label:o;
        return '<option value="'+escapeHtml(ov)+'" '+(String(val)===String(ov)?'selected':'')+'>'+escapeHtml(ol)+'</option>'; }).join('')+
      '</select>';
  } else if(f.type==='textarea'){
    inner = '<textarea class="textarea" id="ff_'+f.key+'">'+escapeHtml(val)+'</textarea>';
  } else if(f.type==='checkbox'){
    return '<div class="field '+(f.span2?'span-2':'')+'"><label class="check-row"><input type="checkbox" id="ff_'+f.key+'" '+(val?'checked':'')+'> '+escapeHtml(f.label)+'</label>'+(f.hint?'<div class="field-hint">'+escapeHtml(f.hint)+'</div>':'')+'</div>';
  } else if(f.type==='number'||f.type==='currency'){
    inner = '<input class="input" type="number" step="any" id="ff_'+f.key+'" value="'+escapeHtml(val)+'" '+(f.min!=null?'min="'+f.min+'"':'')+'>';
  } else if(f.type==='date'){
    inner = '<input class="input" type="date" id="ff_'+f.key+'" value="'+escapeHtml(val)+'">';
  } else {
    inner = '<input class="input" type="text" id="ff_'+f.key+'" value="'+escapeHtml(val)+'" '+(f.readonly?'readonly':'')+'>';
  }
  return '<div class="field '+(f.span2?'span-2':'')+'" data-fieldkey="'+f.key+'">'+
    '<label class="field-label">'+escapeHtml(f.label)+req+'</label>'+inner+
    (f.hint?'<div class="field-hint">'+escapeHtml(f.hint)+'</div>':'')+'</div>';
}
function readFieldValue(f, values){
  const el = document.getElementById('ff_'+f.key);
  if(!el) return values[f.key];
  if(f.type==='checkbox') return el.checked;
  if(f.type==='number'||f.type==='currency') return el.value===''?0:parseFloat(el.value);
  return el.value;
}
function refreshFormVisibility(fields, values){
  fields.forEach(f=>{
    const wrap = document.querySelector('[data-fieldkey="'+f.key+'"]');
    if(!wrap) return;
    wrap.style.display = fieldVisible(f, values) ? '' : 'none';
  });
}
function openEntityForm(cfg, existing){
  const fields = cfg.fields;
  let values = Object.assign({}, cfg.defaults?cfg.defaults():{}, existing||{});
  const isEdit = !!existing;
  const html = '<div class="modal-panel '+(cfg.wide?'wide':'')+'">'+
    '<div class="modal-head"><h3>'+(isEdit?'Edit ':'Add ')+escapeHtml(cfg.title)+'</h3>'+
    '<button class="btn btn-icon btn-ghost" id="formCloseBtn">'+icon('close')+'</button></div>'+
    '<div class="modal-body"><div class="form-grid" id="entityFormGrid">'+
    fields.map(f=>renderFieldHtml(f, values)).join('')+
    '</div></div>'+
    '<div class="modal-foot">'+(isEdit&&cfg.onDelete?'<button class="btn btn-danger" id="formDeleteBtn" style="margin-right:auto;">'+icon('trash')+' Delete</button>':'')+
    '<button class="btn" id="formCancelBtn">Cancel</button><button class="btn btn-primary" id="formSaveBtn">'+icon('check')+' Save</button></div>'+
    '</div>';
  openModalRaw(html);
  document.getElementById('formCloseBtn').onclick = closeModal;
  document.getElementById('formCancelBtn').onclick = closeModal;
  refreshFormVisibility(fields, values);
  fields.forEach(f=>{
    const el = document.getElementById('ff_'+f.key);
    if(!el) return;
    el.addEventListener('input', ()=>{
      values[f.key] = readFieldValue(f, values);
      if(f.key==='price') values._priceTouched=true;
      if(f.key==='directCost') values._costTouched=true;
      if(f.key==='paymentFee') values._feeTouched=true;
      if(f.onChange) f.onChange(values);
      fields.forEach(f2=>{
        if(f2.recompute) values[f2.key]=f2.recompute(values);
        const e2=document.getElementById('ff_'+f2.key);
        if(!e2) return;
        if(f2.recompute){ if(f2.type==='checkbox') e2.checked=values[f2.key]; else e2.value=values[f2.key]; }
        if(f2.type==='select' && typeof f2.options==='function' && f2.key!==f.key){
          const curVal = values[f2.key];
          const opts = optionsForField(f2, values);
          const stillValid = opts.some(o=>String((typeof o==='object')?o.value:o)===String(curVal));
          e2.innerHTML = (f2.placeholder?'<option value="">'+escapeHtml(f2.placeholder)+'</option>':'')+
            opts.map(o=>{ const ov=(typeof o==='object')?o.value:o; const ol=(typeof o==='object')?o.label:o; return '<option value="'+escapeHtml(ov)+'" '+(String(curVal)===String(ov)?'selected':'')+'>'+escapeHtml(ol)+'</option>'; }).join('');
          if(!stillValid && opts.length){ const firstVal=(typeof opts[0]==='object')?opts[0].value:opts[0]; e2.value=firstVal; values[f2.key]=firstVal; }
        }
      });
      refreshFormVisibility(fields, values);
    });
  });
  if(isEdit && cfg.onDelete){
    document.getElementById('formDeleteBtn').onclick = async ()=>{
      const ok = await confirmDialog({title:'Delete '+cfg.title+'?', message:'This will move the record to Trash. You can restore it later from Settings → Data Management.', danger:true, okText:'Delete'});
      if(ok){ cfg.onDelete(existing); closeModal(); render(); toast(cfg.title+' deleted.'); }
    };
  }
  document.getElementById('formSaveBtn').onclick = ()=>{
    fields.forEach(f=>{ if(fieldVisible(f,values)) values[f.key]=readFieldValue(f,values); });
    for(const f of fields){
      if(f.required && fieldVisible(f,values) && (values[f.key]===''||values[f.key]==null)){
        toast('Please fill in "'+f.label+'".','error'); return;
      }
    }
    cfg.onSave(values, existing);
    closeModal(); render();
    toast(cfg.title+(isEdit?' updated.':' added.'));
  };
}

function paginateArr(arr, page, perPage){ return arr.slice(page*perPage, page*perPage+perPage); }

const CRUD_UI = {};
function renderCrudPage(container, cfgIn){

  const cfg = Object.assign({}, cfgIn);
  const ui = CRUD_UI[uiKey] = CRUD_UI[uiKey] || {_page:0,_search:'',_filters:{},_sortKey:null,_sortDir:1};
  cfg._page = ui._page; cfg._search = ui._search; cfg._filters = ui._filters; cfg._sortKey = ui._sortKey; cfg._sortDir = ui._sortDir;
  cfg._setPage = v=>{ ui._page=v; }; cfg._setSearch=v=>{ ui._search=v; }; cfg._setFilter=(k,v)=>{ ui._filters[k]=v; };

  let rows = Entities.list(cfg.collection).slice();
  if(cfg.rangeScoped && APP.range) rows = rows.filter(r=>inRange(r[cfg.dateKey||'date'], APP.range.start, APP.range.end));
  if(cfg._search){
    const q = cfg._search.toLowerCase();
    rows = rows.filter(r=> (cfg.searchText(r)||'').toLowerCase().includes(q));
  }
  Object.keys(cfg._filters).forEach(fk=>{
    const v = cfg._filters[fk];
    if(v) rows = rows.filter(r=> cfg.filters.find(f=>f.key===fk).match(r,v));
  });
  if(cfg._sortKey){
    rows.sort((a,b)=>{
      const av = cfg._sortKey(a), bv=cfg._sortKey(b);
      if(av<bv) return -1*cfg._sortDir; if(av>bv) return 1*cfg._sortDir; return 0;
    });
  } else if(cfg.defaultSort){
    rows.sort(cfg.defaultSort);
  }

  const total = rows.length;
  const perPage = cfg.perPage||12;
  const pageRows = paginateArr(rows, cfg._page, perPage);

  let html = '<div class="page-head"><div><h2>'+cfg.title+'</h2><p class="sub">'+cfg.subtitle+'</p></div>'+
    '<div class="toolbar">'+
    (cfg.exportName?'<button class="btn" id="crudExportBtn">'+icon('download')+' Export CSV</button>':'')+
    '<button class="btn btn-primary" id="crudAddBtn">'+icon('plus')+' Add '+cfg.itemName+'</button>'+
    '</div></div>';

  html += '<div class="filter-bar">';
  html += '<div class="search-input-wrap">'+icon('search')+'<input class="input" id="crudSearch" placeholder="Search '+cfg.itemName.toLowerCase()+'s…" value="'+escapeHtml(cfg._search)+'"></div>';
  (cfg.filters||[]).forEach(f=>{
    html += '<select class="select" id="crudFilter_'+f.key+'" style="width:auto;"><option value="">'+f.label+' (All)</option>'+
      f.options.map(o=>'<option value="'+escapeHtml(o)+'" '+(cfg._filters[f.key]===o?'selected':'')+'>'+escapeHtml(o)+'</option>').join('')+'</select>';
  });
  html += '</div>';

  if(total===0){
    html += '<div class="card"><div class="empty-state">'+icon(cfg.icon||'dot','icon-lg')+
      '<h4>'+cfg.emptyTitle+'</h4><p>'+cfg.emptyDesc+'</p>'+
      '<button class="btn btn-primary" id="crudEmptyAddBtn">'+icon('plus')+' '+cfg.emptyCta+'</button></div></div>';
  } else {
    html += '<div class="table-wrap"><table class="tbl"><thead><tr>'+
      cfg.columns.map(c=>'<th>'+c.label+'</th>').join('')+'<th></th></tr></thead><tbody>'+
      pageRows.map(r=> '<tr>'+cfg.columns.map(c=>'<td class="'+(c.cls||'')+'">'+c.render(r)+'</td>').join('')+
        '<td><div class="row-actions">'+
        (cfg.rowActions.includes('edit')?'<button class="btn btn-icon btn-ghost" data-act="edit" data-id="'+r.id+'" title="Edit">'+icon('edit')+'</button>':'')+
        (cfg.rowActions.includes('duplicate')?'<button class="btn btn-icon btn-ghost" data-act="dup" data-id="'+r.id+'" title="Duplicate">'+icon('copy')+'</button>':'')+
        (cfg.rowActions.includes('delete')?'<button class="btn btn-icon btn-ghost" data-act="del" data-id="'+r.id+'" title="Delete">'+icon('trash')+'</button>':'')+
        '</div></td></tr>').join('')+
      '</tbody></table></div>';
    html += '<div class="pagination"><span>Showing '+(cfg._page*perPage+1)+'–'+Math.min(total,(cfg._page+1)*perPage)+' of '+total+'</span>'+
      '<button class="btn btn-sm" id="crudPrev" '+(cfg._page===0?'disabled':'')+'>Prev</button>'+
      '<button class="btn btn-sm" id="crudNext" '+((cfg._page+1)*perPage>=total?'disabled':'')+'>Next</button></div>';
  }
  container.innerHTML = html;

  const addHandler = ()=> openEntityForm({
    title:cfg.itemName, fields:cfg.formFields, wide:cfg.wide, defaults:cfg.formDefaults,
    onSave:(vals)=> cfg.onCreate(vals)
  });
  const addBtn = document.getElementById('crudAddBtn'); if(addBtn) addBtn.onclick = addHandler;
  const emptyAddBtn = document.getElementById('crudEmptyAddBtn'); if(emptyAddBtn) emptyAddBtn.onclick = addHandler;
  const exportBtn = document.getElementById('crudExportBtn'); if(exportBtn) exportBtn.onclick = ()=> exportCsv(cfg.exportName, cfg.columns.map(c=>c.label), rows.map(r=>cfg.columns.map(c=>c.csv?c.csv(r):stripHtml(c.render(r)))));

  document.getElementById('crudSearch').addEventListener('input', debounce(e=>{ ui._search=e.target.value; ui._page=0; renderCrudPage(container,cfgIn); },220));
  (cfg.filters||[]).forEach(f=>{
    document.getElementById('crudFilter_'+f.key).addEventListener('change', e=>{ ui._filters[f.key]=e.target.value; ui._page=0; renderCrudPage(container,cfgIn); });
  });
  const prevBtn=document.getElementById('crudPrev'); if(prevBtn) prevBtn.onclick=()=>{ ui._page--; renderCrudPage(container,cfgIn); };
  const nextBtn=document.getElementById('crudNext'); if(nextBtn) nextBtn.onclick=()=>{ ui._page++; renderCrudPage(container,cfgIn); };

  container.querySelectorAll('[data-act]').forEach(btn=>{
    const id = btn.getAttribute('data-id'); const act = btn.getAttribute('data-act');
    const rec = Entities.get(cfg.collection, id);
    if(act==='edit') btn.onclick=()=> openEntityForm({ title:cfg.itemName, fields:cfg.formFields, wide:cfg.wide, defaults:cfg.formDefaults,
      onSave:(vals)=>cfg.onUpdate(id,vals), onDelete:()=>cfg.onDelete(id) }, rec);
    if(act==='dup') btn.onclick=()=>{ cfg.onDuplicate?cfg.onDuplicate(id):Entities.duplicate(cfg.collection,id); render(); toast(cfg.itemName+' duplicated.'); };
    if(act==='del') btn.onclick=async ()=>{ const ok=await confirmDialog({title:'Delete '+cfg.itemName+'?', message:'This moves the record to Trash. You can restore it from Settings.', danger:true, okText:'Delete'}); if(ok){ cfg.onDelete(id); render(); toast(cfg.itemName+' deleted.'); } };
  });
}
function stripHtml(s){ return String(s==null?'':s).replace(/<[^>]*>/g,'').replace(/&nbsp;/g,' ').trim(); }

/* CSV export via downloads capability -------------------------------------*/
let DOWNLOADS_NS = null;
async function getDownloads(){
  if(!window.claude || !window.claude.use) return null;
  if(DOWNLOADS_NS) return DOWNLOADS_NS;
  try{ DOWNLOADS_NS = await window.claude.use('downloads'); }catch(e){ DOWNLOADS_NS = null; }
  return DOWNLOADS_NS;
}
/* Standard browser download — used when hosted outside Claude (Netlify, Vercel, etc.) */
function browserDownload(filename, blob){
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename; a.style.display = 'none';
  document.body.appendChild(a); a.click();
  setTimeout(()=>{ document.body.removeChild(a); URL.revokeObjectURL(url); }, 1000);
}
async function saveFile(filename, blob, okMsg){
  const dl = await getDownloads();
  if(!dl){ browserDownload(filename, blob); toast(okMsg); return; }
  try{
    const res = await dl.save({filename, data: blob});
    toast(res.status==='saved' ? okMsg : 'Export ready.');
  }catch(err){
    if(err && err.code==='declined'){ return; }
    // Claude download refused for another reason — fall back to a normal browser download
    try{ browserDownload(filename, blob); toast(okMsg); }
    catch(e){ toast('Could not export file: '+(err&&err.message?err.message:'unknown error'),'error'); }
  }
}
function csvEscape(v){ v = v==null?'':String(v); if(/[",\n]/.test(v)) return '"'+v.replace(/"/g,'""')+'"'; return v; }
function toCsv(headers, rows){ return headers.map(csvEscape).join(',')+'\n'+rows.map(r=>r.map(csvEscape).join(',')).join('\n'); }
async function exportCsv(filename, headers, rows){
  const csv = toCsv(headers, rows);
  const fname = filename.endsWith('.csv')?filename:filename+'.csv';
  await saveFile(fname, new Blob([csv],{type:'text/csv'}), fname+' saved.');
}
async function exportJsonBackup(){
  const data = JSON.stringify(STATE, null, 2);
  const fname = 'ad-business-tracker-backup-'+todayStr()+'.json';
  await saveFile(fname, new Blob([data],{type:'application/json'}), 'Backup saved.');
}

/* =========================================================================
   8. CHARTS (hand-built SVG, dataviz categorical palette)
   ========================================================================= */
const CHART_CATS = ['#3987e5','#d95926','#199e70','#c98500','#d55181','#3fae3f','#9085e9','#e66767'];
const CHART_MUTED = '#6f6f6f';
const CHART_GRID = '#232323';
const CHART_TEXT2 = '#A7A7A7';

function niceMax(v){ if(v<=0) return 10; const p = Math.pow(10, Math.floor(Math.log10(v))); const n=v/p; let m; if(n<=1)m=1; else if(n<=2)m=2; else if(n<=5)m=5; else m=10; return m*p; }

function mountLineChart(container, series, opts){
  opts = opts||{};
  const W = opts.width||680, H = opts.height||260;
  const padL=52, padR=16, padT=16, padB=30;
  const innerW = W-padL-padR, innerH = H-padT-padB;
  const labels = opts.labels||[];
  if(!labels.length || series.every(s=>s.data.every(v=>!v))){
    container.innerHTML = '<div class="chart-empty">'+icon('reports','icon-lg')+' &nbsp;Not enough data yet for this chart.</div>';
    return;
  }
  let maxV = 0; series.forEach(s=> s.data.forEach(v=> maxV=Math.max(maxV, v)));
  maxV = niceMax(maxV*1.15 || 10);
  const n = labels.length;
  const xAt = i => padL + (n<=1?innerW/2:(innerW*i/(n-1)));
  const yAt = v => padT + innerH - (v/maxV)*innerH;

  const gridLines = [0,0.25,0.5,0.75,1].map(t=>{
    const y = padT+innerH-t*innerH;
    return '<line x1="'+padL+'" x2="'+(W-padR)+'" y1="'+y+'" y2="'+y+'" stroke="'+CHART_GRID+'" stroke-width="1"/>'+
      '<text x="'+(padL-8)+'" y="'+(y+4)+'" font-size="10" fill="'+CHART_TEXT2+'" text-anchor="end" font-family="IBM Plex Mono, monospace">'+opts.yFormat(t*maxV)+'</text>';
  }).join('');

  const step = Math.max(1, Math.ceil(n/7));
  const xLabels = labels.map((l,i)=> (i%step===0||i===n-1) ? '<text x="'+xAt(i)+'" y="'+(H-8)+'" font-size="10" fill="'+CHART_TEXT2+'" text-anchor="middle">'+l+'</text>' : '').join('');

  const paths = series.map((s,si)=>{
    const color = s.color||CHART_CATS[si%CHART_CATS.length];
    const pts = s.data.map((v,i)=> xAt(i)+','+yAt(v));
    const line = 'M'+pts.join(' L');
    let area='';
    if(s.area){
      area = '<path d="M'+xAt(0)+','+yAt(0)+' L'+pts.join(' L')+' L'+xAt(n-1)+','+yAt(0)+' Z" fill="'+color+'" opacity="0.12"/>';
    }
    const dots = s.data.map((v,i)=> '<circle class="pt" data-si="'+si+'" data-i="'+i+'" cx="'+xAt(i)+'" cy="'+yAt(v)+'" r="3" fill="'+color+'" stroke="'+'#111'+'" stroke-width="1.5"/>').join('');
    return area+'<path d="'+line+'" fill="none" stroke="'+color+'" stroke-width="2.25" stroke-linejoin="round" stroke-linecap="round"/>'+dots;
  }).join('');

  const svg = '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%; height:auto; display:block; overflow:visible;">'+gridLines+xLabels+paths+
    '<line x1="'+padL+'" x2="'+(W-padR)+'" y1="'+(padT+innerH)+'" y2="'+(padT+innerH)+'" stroke="#383835" stroke-width="1"/>'+
    '<rect id="hoverCatcher" x="'+padL+'" y="'+padT+'" width="'+innerW+'" height="'+innerH+'" fill="transparent"/></svg>';

  container.innerHTML = '<div style="position:relative;">'+svg+'</div>';
  if(series.length>1 || opts.forceLegend){
    container.innerHTML += '<div class="chart-legend">'+series.map((s,si)=>'<div class="legend-item"><span class="legend-swatch" style="background:'+(s.color||CHART_CATS[si%CHART_CATS.length])+'"></span>'+s.name+'</div>').join('')+'</div>';
  }
  const wrap = container.querySelector('div');
  const catcher = container.querySelector('#hoverCatcher');
  let tip;
  catcher.addEventListener('mousemove', e=>{
    const rect = catcher.getBoundingClientRect();
    const relX = (e.clientX-rect.left)/rect.width;
    let idx = Math.round(relX*(n-1)); idx = clamp(idx,0,n-1);
    if(!tip){ tip = document.createElement('div'); tip.className='chart-tooltip'; wrap.appendChild(tip); }
    tip.innerHTML = '<div style="font-weight:800; margin-bottom:4px;">'+labels[idx]+'</div>'+
      series.map((s,si)=>'<div><span style="color:'+(s.color||CHART_CATS[si%CHART_CATS.length])+'">●</span> '+s.name+': <b>'+(opts.yFormat?opts.yFormat(s.data[idx]):s.data[idx])+'</b></div>').join('');
    const svgRect = wrap.getBoundingClientRect();
    let left = (xAt(idx)/W)*svgRect.width + 10;
    if(left + 160 > svgRect.width) left -= 180;
    tip.style.left = left+'px';
    tip.style.top = '6px';
  });
  catcher.addEventListener('mouseleave', ()=>{ if(tip){ tip.remove(); tip=null; } });
}

function mountBarChart(container, data, opts){
  opts = opts||{};
  data = data.filter(d=>d);
  if(!data.length){ container.innerHTML = '<div class="chart-empty">'+icon('reports','icon-lg')+' &nbsp;Not enough data yet for this chart.</div>'; return; }
  const horizontal = opts.horizontal;
  const maxV = niceMax(Math.max(...data.map(d=>d.value), 0)*1.15 || 10);
  if(horizontal){
    const rowH = 30, W=680, padL=Math.min(190, Math.max(100, opts.labelWidth||130)), padR=64, gap=8;
    const H = data.length*rowH + 10;
    const innerW = W-padL-padR;
    const maxChars = Math.max(7, Math.floor((padL-16)/6.4)-2);
    const bars = data.map((d,i)=>{
      const y = i*rowH+6;
      const w = Math.max(2, (d.value/maxV)*innerW);
      const color = d.color||CHART_CATS[i%CHART_CATS.length];
      return '<text x="'+(padL-10)+'" y="'+(y+13)+'" font-size="11" fill="'+CHART_TEXT2+'" text-anchor="end">'+truncLabel(d.label,maxChars)+'</text>'+
        '<rect x="'+padL+'" y="'+y+'" width="'+innerW+'" height="18" rx="4" fill="'+CHART_GRID+'"/>'+
        '<rect class="bar" data-i="'+i+'" x="'+padL+'" y="'+y+'" width="'+w+'" height="18" rx="4" fill="'+color+'"/>'+
        '<text x="'+(padL+w+8)+'" y="'+(y+13)+'" font-size="11" fill="var(--text)" font-family="IBM Plex Mono, monospace" font-weight="600">'+(opts.yFormat?opts.yFormat(d.value):d.value)+'</text>';
    }).join('');
    container.innerHTML = '<div style="position:relative;"><svg viewBox="0 0 '+W+' '+H+'" style="width:100%; height:auto; display:block;">'+bars+'</svg></div>';
  } else {
    const W=680, H=260, padL=52, padR=16, padT=16, padB=34;
    const innerW=W-padL-padR, innerH=H-padT-padB;
    const n = data.length;
    const bw = Math.min(46, innerW/n*0.55);
    const gridLines = [0,0.25,0.5,0.75,1].map(t=>{ const y=padT+innerH-t*innerH; return '<line x1="'+padL+'" x2="'+(W-padR)+'" y1="'+y+'" y2="'+y+'" stroke="'+CHART_GRID+'"/><text x="'+(padL-8)+'" y="'+(y+4)+'" font-size="10" fill="'+CHART_TEXT2+'" text-anchor="end" font-family="IBM Plex Mono, monospace">'+opts.yFormat(t*maxV)+'</text>'; }).join('');
    const bars = data.map((d,i)=>{
      const cx = padL + innerW*(i+0.5)/n;
      const h = Math.max(1,(d.value/maxV)*innerH);
      const y = padT+innerH-h;
      const color = d.color||CHART_CATS[i%CHART_CATS.length];
      return '<rect class="bar" data-i="'+i+'" x="'+(cx-bw/2)+'" y="'+y+'" width="'+bw+'" height="'+h+'" rx="5" fill="'+color+'"/>'+
        '<text x="'+cx+'" y="'+(H-10)+'" font-size="10" fill="'+CHART_TEXT2+'" text-anchor="middle">'+truncLabel(d.label,9)+'</text>';
    }).join('');
    container.innerHTML = '<div style="position:relative;"><svg viewBox="0 0 '+W+' '+H+'" style="width:100%; height:auto; display:block;">'+gridLines+bars+
      '<line x1="'+padL+'" x2="'+(W-padR)+'" y1="'+(padT+innerH)+'" y2="'+(padT+innerH)+'" stroke="#383835"/></svg></div>';
  }
  const wrap = container.querySelector('div');
  let tip;
  container.querySelectorAll('.bar').forEach(barEl=>{
    barEl.addEventListener('mousemove', e=>{
      const i = +barEl.getAttribute('data-i'); const d = data[i];
      if(!tip){ tip=document.createElement('div'); tip.className='chart-tooltip'; wrap.appendChild(tip); }
      tip.innerHTML = '<b>'+escapeHtml(d.label)+'</b><br>'+(opts.yFormat?opts.yFormat(d.value):d.value);
      const wrapRect = wrap.getBoundingClientRect();
      tip.style.left = clamp(e.clientX-wrapRect.left+10, 0, wrapRect.width-160)+'px';
      tip.style.top = Math.max(0,e.clientY-wrapRect.top-40)+'px';
    });
    barEl.addEventListener('mouseleave', ()=>{ if(tip){ tip.remove(); tip=null; } });
  });
}
function truncLabel(s,n){ s=String(s); return s.length>n? s.slice(0,n-1)+'…' : s; }

function monthsBack(k){
  const arr=[]; const t=new Date();
  for(let i=k-1;i>=0;i--){ const d=new Date(t.getFullYear(), t.getMonth()-i, 1); arr.push(d.getFullYear()+'-'+pad2(d.getMonth()+1)); }
  return arr;
}

function kpiCardHtml(label, value, delta, tip){
  return '<div class="card kpi"><div class="k-label">'+escapeHtml(label)+(tip?' <span class="k-tip" title="'+escapeHtml(tip)+'">'+icon('info','icon-sm')+'</span>':'')+'</div>'+
    '<div class="k-value num">'+value+'</div>'+
    (delta?'<div class="k-delta '+delta.cls+'">'+icon(delta.cls==='up'?'arrowUp':(delta.cls==='down'?'arrowDown':'minus'),'icon-sm')+delta.text+'</div>':'')+
    '</div>';
}
function renderDashboardPage(container){
  const range = APP.range;
  const p = Calc_period(range);
  const prevRange = previousEquivalent(range);
  const pp = Calc_period(prevRange);
  const receivables = Calc_outstandingReceivables();
  const outstandingTotal = receivables.reduce((a,s)=>a+Calc_saleBalance(s),0);
  const prevReceivables = Calc_outstandingReceivables().length; // structural, not period based

  let html = '<div class="page-head"><div><h2>Overview</h2><p class="sub">'+rangeDisplay(range)+'</p></div></div>';

  html += '<div class="grid kpi-grid" style="margin-bottom:14px;">'+
    kpiCardHtml('Total Revenue', fmtMoney(p.netRevenue), pctChangeLabel(p.netRevenue,pp.netRevenue), 'Net Revenue = Gross Sales − Refunds, for the selected period.')+
    kpiCardHtml('Total Expenses', fmtMoney(p.totalExpenses), pctChangeLabel(p.totalExpenses,pp.totalExpenses), 'Direct costs + payment fees + operating expenses + ad spend + payroll.')+
    kpiCardHtml('Net Profit', fmtMoney(p.netProfit), pctChangeLabel(p.netProfit,pp.netProfit), 'Net Revenue minus every cost: direct, operating, advertising and payroll.')+
    kpiCardHtml('Net Profit Margin', fmtPct(p.netMargin), pctChangeLabel(p.netMargin,pp.netMargin), 'Net Profit ÷ Net Revenue.')+
    '</div>';
  html += '<div class="grid kpi-grid" style="margin-bottom:20px;">'+
    kpiCardHtml('Ad Spend', fmtMoney(p.adSpend), pctChangeLabel(p.adSpend,pp.adSpend), 'Total spend logged in Advertising for this period.')+
    kpiCardHtml('Blended ROAS', (p.roasBlended?p.roasBlended.toFixed(2):'0.00')+'x', pctChangeLabel(p.roasBlended,pp.roasBlended), 'Net Revenue ÷ Ad Spend — your whole business, not just attributed sales.')+
    kpiCardHtml('Total Sales', fmtNum(p.sales.length,0), pctChangeLabel(p.sales.length,pp.sales.length), 'Number of sale transactions recorded in this period.')+
    kpiCardHtml('Outstanding Receivables', fmtMoney(outstandingTotal), null, 'Total unpaid balance across all clients, as of today (not period-bound).')+
    '</div>';

  html += '<div class="grid" style="grid-template-columns:2fr 1fr; margin-bottom:14px;" id="dashTopGrid">'+
    '<div class="card"><div class="card-head"><h3>Revenue vs Expenses vs Net Profit</h3><span class="sub">Last 6 months</span></div><div id="mainTrendChart"></div></div>'+
    '<div class="card"><div class="card-head"><h3>Revenue Target</h3><span class="sub">'+fmtMonthLabel(monthKey(todayStr()))+'</span></div><div id="dashTargetProgress"></div></div>'+
    '</div>';

  html += '<div class="grid grid-3" style="margin-bottom:14px;">'+
    '<div class="card"><div class="card-head"><h3>Revenue by Offer</h3></div><div id="dashRevByOffer"></div></div>'+
    '<div class="card"><div class="card-head"><h3>Expense Breakdown</h3></div><div id="dashExpBreakdown"></div></div>'+
    '<div class="card"><div class="card-head"><h3>Advertising Performance</h3></div><div id="dashAdPerf"></div></div>'+
    '</div>';

  html += '<div class="grid" style="grid-template-columns:1.6fr 1fr;">'+
    '<div class="card"><div class="card-head"><h3>Recent Transactions</h3><a class="btn btn-sm" data-goto="transactions">View all</a></div><div id="dashRecentTxn"></div></div>'+
    '<div class="card"><div class="card-head"><h3>Outstanding Client Balances</h3><a class="btn btn-sm" data-goto="receivables">View all</a></div><div id="dashOutstanding"></div></div>'+
    '</div>';
  html += '<div class="card" style="margin-top:14px;"><div class="card-head"><h3>Business Alerts</h3><a class="btn btn-sm" data-goto="alerts">View all</a></div><div id="dashAlerts"></div></div>';

  container.innerHTML = html;
  container.querySelectorAll('[data-goto]').forEach(el=> el.onclick=()=>goTo(el.getAttribute('data-goto')));

  // main trend chart: last 6 months
  const months = monthsBack(6);
  const revSeries=[], expSeries=[], profitSeries=[];
  months.forEach(mk=>{
    const r = resolveRange('Custom Range', {start:mk+'-01', end: mk===monthKey(todayStr())?todayStr():toDateStr(new Date(+mk.slice(0,4), +mk.slice(5,7),0))});
    const pm = Calc_period(r);
    revSeries.push(round0(pm.netRevenue)); expSeries.push(round0(pm.totalExpenses)); profitSeries.push(round0(pm.netProfit));
  });
  mountLineChart(document.getElementById('mainTrendChart'), [
    {name:'Revenue', data:revSeries, color:'#3987e5', area:true},
    {name:'Expenses', data:expSeries, color:'#e66767'},
    {name:'Net Profit', data:profitSeries, color:'#FFD400'},
  ], {labels:months.map(fmtMonthLabel), yFormat:v=>fmtMoney(v)});

  // target progress
  const tgt = Entities.list('targets').find(t=>t.month===monthKey(todayStr()));
  const tEl = document.getElementById('dashTargetProgress');
  if(!tgt){
    tEl.innerHTML = '<div class="empty-state" style="padding:24px 8px;">'+icon('targets','icon-lg')+'<h4 style="font-size:13px;">No target set</h4><p>Set a monthly revenue goal in Targets.</p><button class="btn btn-primary btn-sm" id="goSetTarget">Set Target</button></div>';
    document.getElementById('goSetTarget').onclick=()=>goTo('targets');
  } else {
    const mRange = resolveRange('This Month');
    const mp = Calc_period(mRange);
    const pct = clamp(safeDiv(mp.netRevenue, tgt.revenueGoal),0,1.4);
    const daysInMonth = new Date(+mRange.start.slice(0,4), +mRange.start.slice(5,7), 0).getDate();
    const daysRemaining = Math.max(0, daysInMonth - (new Date().getDate()));
    const remaining = Math.max(0, tgt.revenueGoal - mp.netRevenue);
    const requiredDaily = daysRemaining>0 ? remaining/daysRemaining : 0;
    tEl.innerHTML = '<div class="mini-stat" style="margin-bottom:10px;"><span class="lbl">Goal</span><span class="val num">'+fmtMoney(tgt.revenueGoal)+'</span></div>'+
      '<div class="progress-track" style="margin-bottom:8px;"><div class="progress-fill '+(pct<0.5?'danger':pct<0.85?'warning':'')+'" style="width:'+(pct*100)+'%"></div></div>'+
      '<div style="display:flex; justify-content:space-between; font-size:11.5px; color:var(--text2); margin-bottom:14px;"><span>'+fmtPct(pct)+' achieved</span><span>'+fmtMoney(mp.netRevenue)+' of '+fmtMoney(tgt.revenueGoal)+'</span></div>'+
      '<div class="grid grid-2" style="gap:10px;">'+
      '<div class="mini-stat"><span class="lbl">Remaining</span><span class="val num" style="font-size:14px;">'+fmtMoney(remaining)+'</span></div>'+
      '<div class="mini-stat"><span class="lbl">Days Left</span><span class="val num" style="font-size:14px;">'+daysRemaining+'</span></div>'+
      '<div class="mini-stat"><span class="lbl">Required Daily</span><span class="val num" style="font-size:14px;">'+fmtMoney(requiredDaily)+'</span></div>'+
      '<div class="mini-stat"><span class="lbl">Projected Month-End</span><span class="val num" style="font-size:14px;">'+fmtMoney(new Date().getDate()>0? (mp.netRevenue/new Date().getDate())*daysInMonth : 0)+'</span></div>'+
      '</div>';
  }

  // revenue by offer
  const offerRev = {};
  p.sales.forEach(s=>{ const o=offerOf(s.offerId); const key=o?o.name:'Unknown'; offerRev[key]=(offerRev[key]||0)+Calc_saleNet(s); });
  const offerData = Object.keys(offerRev).map(k=>({label:k, value:offerRev[k]})).sort((a,b)=>b.value-a.value).slice(0,6);
  mountBarChart(document.getElementById('dashRevByOffer'), offerData, {horizontal:true, yFormat:fmtMoney});

  // expense breakdown
  const expByCat = {};
  p.lines.forEach(l=>{ expByCat[l.categoryName]=(expByCat[l.categoryName]||0)+l.amount; });
  const expData = Object.keys(expByCat).map((k,i)=>({label:k, value:expByCat[k]})).sort((a,b)=>b.value-a.value).slice(0,6);
  mountBarChart(document.getElementById('dashExpBreakdown'), expData, {horizontal:true, yFormat:fmtMoney});

  // ad performance mini stats
  document.getElementById('dashAdPerf').innerHTML =
    '<div class="list-plain">'+
    listRow('Total Ad Spend', fmtMoney(p.adSpend))+
    listRow('Total Messages', fmtNum(p.totalMessages,0))+
    listRow('Avg. Cost / Message', fmtMoney(p.cpm))+
    listRow('Total Purchases', fmtNum(p.totalPurchases,0))+
    listRow('Avg. Cost / Purchase', fmtMoney(p.cpp))+
    listRow('Attributed ROAS', (p.roasAttributed||0).toFixed(2)+'x')+
    '</div>';

  // recent transactions
  const recent = getAllExpenseLines().map(l=>({date:l.date,label:l.name,amount:-l.amount,type:l.categoryName}))
    .concat(Entities.list('sales').map(s=>({date:s.date, label:(clientOf(s.clientId)||{}).name||'Sale', amount:Calc_saleNet(s), type:'Sale'})))
    .sort((a,b)=> b.date.localeCompare(a.date)).slice(0,8);
  document.getElementById('dashRecentTxn').innerHTML = recent.length ? '<div class="list-plain">'+recent.map(t=>
    '<div class="list-row"><div style="display:flex;align-items:center;gap:10px;"><div class="avatar">'+icon(t.amount>=0?'arrowUp':'arrowDown','icon-sm')+'</div><div><div style="font-weight:700; font-size:12.6px;">'+escapeHtml(t.label)+'</div><div class="cell-muted" style="font-size:11px;">'+t.type+' · '+fmtDateShort(t.date)+'</div></div></div>'+
    '<div class="num" style="font-weight:800; color:'+(t.amount>=0?'var(--success)':'var(--text)')+'">'+(t.amount>=0?'+':'')+fmtMoney(t.amount)+'</div></div>').join('')+'</div>'
    : emptyInline('No transactions yet.', 'Record your first sale or expense to see it here.');

  // outstanding balances
  const topOutstanding = receivables.map(s=>({client:clientOf(s.clientId), bal:Calc_saleBalance(s), s}))
    .sort((a,b)=>b.bal-a.bal).slice(0,6);
  document.getElementById('dashOutstanding').innerHTML = topOutstanding.length ? '<div class="list-plain">'+topOutstanding.map(r=>
    '<div class="list-row"><div style="display:flex;align-items:center;gap:10px;"><div class="avatar">'+initials(r.client?r.client.name:'?')+'</div><div><div style="font-weight:700; font-size:12.6px;">'+escapeHtml(r.client?r.client.name:'Unknown client')+'</div><div class="cell-muted" style="font-size:11px;">Due '+fmtDateShort(r.s.dueDate)+'</div></div></div>'+
    '<div class="num" style="font-weight:800;">'+fmtMoney(r.bal)+'</div></div>').join('')+'</div>'
    : emptyInline('No outstanding balances.', 'All client payments are up to date.');

  // alerts
  const alerts = computeAlerts().slice(0,5);
  document.getElementById('dashAlerts').innerHTML = alerts.length ? alerts.map(a=>alertRowHtml(a)).join('') : emptyInline('No alerts right now.', 'You\'ll see budget, ROAS and payment alerts here.');
  document.getElementById('dashAlerts').querySelectorAll('.alert-row').forEach(el=>el.onclick=()=>{ const a=alerts.find(x=>x.key===el.getAttribute('data-key')); if(a&&a.goto) goTo(a.goto); });
}

function getMasterTransactions(){
  const rows = [];
  Entities.list('sales').forEach(s=>{
    const c = clientOf(s.clientId);
    rows.push({id:'sale_'+s.id, date:s.date, kind:'Income', desc:(c?c.name:'Sale')+' — '+((offerOf(s.offerId)||{}).name||''), amount:Calc_saleNet(s), account:accountOf(s.account)});
    if(s.refund>0) rows.push({id:'refund_'+s.id, date:s.refundDate||s.date, kind:'Refund', desc:'Refund — '+(c?c.name:'Sale'), amount:-s.refund, account:accountOf(s.account)});
  });
  getAllExpenseLines().forEach(l=>{
    const kind = l.costType==='advertising'?'Advertising':(l.costType==='payroll'?'Payroll':'Expense');
    rows.push({id:l.id, date:l.date, kind, desc:l.name, amount:-l.amount, account:accountOf(l.account)});
  });
  Entities.list('accountTransactions').forEach(t=>{
    rows.push({id:'txn_'+t.id, date:t.date, kind:'Transfer / '+t.type, desc:t.notes||t.type, amount:t.amount, account:accountOf(t.toAccount||t.fromAccount)});
  });
  return rows.sort((a,b)=>b.date.localeCompare(a.date));
}

function badgeForKind(k){
  const map={Income:'success', Refund:'danger', Advertising:'info', Payroll:'warning', Expense:'neutral'};
  let key = k.startsWith('Transfer')?'neutral':(map[k]||'neutral');
  return '<span class="badge badge-'+key+'">'+escapeHtml(k)+'</span>';
}

function renderReceivablesPage(container){
  const all = Calc_outstandingReceivables();
  const total = all.reduce((a,s)=>a+Calc_saleBalance(s),0);
  const dueThisWeek = all.filter(s=>s.dueDate && s.dueDate>=todayStr() && s.dueDate<=addDays(todayStr(),7)).reduce((a,s)=>a+Calc_saleBalance(s),0);
  const overdue = all.filter(s=>Calc_saleStatus(s)==='Overdue').reduce((a,s)=>a+Calc_saleBalance(s),0);
  const thisMonthRange = resolveRange('This Month');
  const collectedThisMonth = Entities.list('sales').filter(s=>inRange(s.date, thisMonthRange.start, thisMonthRange.end)).reduce((a,s)=>a+safeNum(s.amountPaid),0);

  let html = '<div class="page-head"><div><h2>Receivables</h2><p class="sub">Calculated live from Sales — record a payment here and it updates the client, the sale and the cash account together.</p></div></div>';
  html += '<div class="grid kpi-grid" style="margin-bottom:20px;">'+
    kpiCardHtml('Total Receivables', fmtMoney(total))+
    kpiCardHtml('Due This Week', fmtMoney(dueThisWeek))+
    kpiCardHtml('Overdue', fmtMoney(overdue))+
    kpiCardHtml('Collected This Month', fmtMoney(collectedThisMonth))+
    '</div>';
  if(!all.length){
    html += '<div class="card"><div class="empty-state">'+icon('receivables','icon-lg')+'<h4>Nothing outstanding.</h4><p>Every recorded sale has been paid in full. New unpaid or partial sales will show up here.</p></div></div>';
  } else {
    html += '<div class="table-wrap"><table class="tbl"><thead><tr><th>Client</th><th>Reference</th><th>Total</th><th>Paid</th><th>Balance</th><th>Due Date</th><th>Days Overdue</th><th>Status</th><th></th></tr></thead><tbody>'+
      all.sort((a,b)=>Calc_saleBalance(b)-Calc_saleBalance(a)).map(s=>{
        const c=clientOf(s.clientId); const status=Calc_saleStatus(s); const overdueDays = status==='Overdue'?Math.max(0,daysBetween(s.dueDate,todayStr())):0;
        return '<tr><td class="cell-strong">'+escapeHtml(c?c.name:'—')+'</td><td class="cell-muted">#'+s.id.slice(-6).toUpperCase()+'</td>'+
          '<td class="cell-num">'+fmtMoney(Calc_saleGross(s)-s.refund)+'</td><td class="cell-num">'+fmtMoney(s.amountPaid)+'</td>'+
          '<td class="cell-num cell-strong">'+fmtMoney(Calc_saleBalance(s))+'</td><td>'+fmtDateShort(s.dueDate)+'</td>'+
          '<td class="cell-num" style="color:'+(overdueDays>0?'var(--danger)':'var(--text3)')+'">'+(overdueDays>0?overdueDays:'—')+'</td>'+
          '<td>'+statusBadge(status)+'</td><td><button class="btn btn-sm btn-primary" data-payid="'+s.id+'">Record Payment</button></td></tr>';
      }).join('')+'</tbody></table></div>';
  }
  container.innerHTML = html;
  container.querySelectorAll('[data-payid]').forEach(btn=> btn.onclick = ()=> openRecordPaymentModal(btn.getAttribute('data-payid')));
}
function openRecordPaymentModal(saleId){
  const s = Entities.get('sales', saleId); if(!s) return;
  const bal = Calc_saleBalance(s);
  const html = '<div class="modal-panel"><div class="modal-head"><h3>Record Payment</h3><button class="btn btn-icon btn-ghost" id="rpClose">'+icon('close')+'</button></div>'+
    '<div class="modal-body">'+
    '<div class="field"><label class="field-label">Remaining Balance</label><div class="num" style="font-size:20px; font-weight:800;">'+fmtMoney(bal)+'</div></div>'+
    '<div class="field"><label class="field-label">Payment Amount</label><input class="input" type="number" id="rpAmount" value="'+bal+'" max="'+bal+'"></div>'+
    '<div class="field"><label class="field-label">Date</label><input class="input" type="date" id="rpDate" value="'+todayStr()+'"></div>'+
    '<div class="field"><label class="field-label">Deposit To</label><select class="select" id="rpAccount">'+optAccounts().map(a=>'<option value="'+a.value+'" '+(a.value===s.account?'selected':'')+'>'+a.label+'</option>').join('')+'</select></div>'+
    '</div><div class="modal-foot"><button class="btn" id="rpCancel">Cancel</button><button class="btn btn-primary" id="rpSave">'+icon('check')+' Save Payment</button></div></div>';
  openModalRaw(html);
  document.getElementById('rpClose').onclick = closeModal;
  document.getElementById('rpCancel').onclick = closeModal;
  document.getElementById('rpSave').onclick = ()=>{
    const amt = clamp(parseFloat(document.getElementById('rpAmount').value)||0, 0, bal);
    const acct = document.getElementById('rpAccount').value;
    Entities.update('sales', saleId, {amountPaid: safeNum(s.amountPaid)+amt, account: acct});
    closeModal(); render(); toast('Payment recorded.');
  };
}
